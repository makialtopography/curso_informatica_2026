<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Uplink · Estudio de Redes y Ciberseguridad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1420;
    --panel:#161F30;
    --panel-2:#1D2A40;
    --line:#2A3A54;
    --text:#E8EDF6;
    --muted:#8CA0C0;
    --accent:#4FE0C4;
    --accent-dim:#2C5F58;
    --amber:#F2A65A;
    --danger:#F27B6B;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    padding:16px 16px 10px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#111827,var(--ink));
  }
  .brand{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;
  }
  .brand h1{
    font-size:19px;margin:0;letter-spacing:0.3px;font-weight:700;
  }
  .brand h1 span{color:var(--muted);font-weight:500;font-size:12px;display:block;margin-top:2px;}
  .signal{
    width:9px;height:9px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 0 rgba(79,224,196,.6);
    animation:pulse 2.4s infinite;
    flex:0 0 auto;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(79,224,196,.55);}
    70%{box-shadow:0 0 0 8px rgba(79,224,196,0);}
    100%{box-shadow:0 0 0 0 rgba(79,224,196,0);}
  }
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:6px 12px;
    border:1px solid var(--line);
    border-radius:20px;
    font-size:12.5px;
    color:var(--muted);
    background:var(--panel);
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s, color .15s;
  }
  .chip.active{
    border-color:var(--accent);
    color:var(--accent);
  }

  /* ---------- Main ---------- */
  main{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 16px 90px;
  }
  .empty{
    text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;
  }

  /* ---------- Glossary ---------- */
  .search{
    width:100%;padding:11px 14px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-family:inherit;font-size:14px;margin-bottom:14px;
  }
  .search:focus{outline:none;border-color:var(--accent);}
  .module-group{margin-bottom:6px;}
  .module-title{
    font-size:11.5px;color:var(--muted);margin:18px 0 8px;
    font-family:'JetBrains Mono',monospace;
    display:flex;align-items:center;gap:8px;
  }
  .module-title::after{content:"";flex:1;height:1px;background:var(--line);}
  .term-row{
    border-bottom:1px solid var(--line);
    padding:12px 2px;
  }
  .term-row:last-child{border-bottom:none;}
  .term-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    cursor:pointer;
  }
  .term-name{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--amber);font-size:15px;}
  .term-full{color:var(--muted);font-size:12px;margin-top:2px;}
  .term-body{
    max-height:0;overflow:hidden;transition:max-height .25s ease;
  }
  .term-body.open{max-height:400px;margin-top:10px;}
  .term-def{font-size:14px;line-height:1.5;color:var(--text);margin-bottom:8px;}
  .term-ex{
    font-size:13px;color:var(--muted);
    border-left:2px solid var(--accent-dim);
    padding-left:10px;line-height:1.5;
  }

  /* ---------- Flashcards ---------- */
  .fc-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:8px;}
  .fc-progress{color:var(--muted);font-size:12.5px;font-family:'JetBrains Mono',monospace;}
  .fc-card{
    width:100%;max-width:420px;height:260px;
    perspective:1200px;
    cursor:pointer;
  }
  .fc-inner{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .5s;
  }
  .fc-card.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute;inset:0;
    border-radius:14px;border:1px solid var(--line);
    background:var(--panel);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    backface-visibility:hidden;
  }
  .fc-face.back{
    transform:rotateY(180deg);
    background:var(--panel-2);
    align-items:flex-start;text-align:left;justify-content:flex-start;
    overflow-y:auto;
  }
  .fc-tag{
    font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;
    margin-bottom:14px;
  }
  .fc-term{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;color:var(--amber);}
  .fc-full{color:var(--muted);font-size:13px;margin-top:8px;}
  .fc-hint{color:var(--muted);font-size:11.5px;margin-top:18px;}
  .fc-def{font-size:15px;line-height:1.55;margin-bottom:10px;}
  .fc-ex{font-size:13px;color:var(--muted);border-left:2px solid var(--accent-dim);padding-left:10px;line-height:1.5;}
  .fc-controls{display:flex;gap:10px;width:100%;max-width:420px;}
  .btn{
    flex:1;padding:12px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-family:inherit;font-size:14px;
    cursor:pointer;font-weight:500;
  }
  .btn.primary{background:var(--accent);color:#08201B;border-color:var(--accent);font-weight:600;}
  .btn.ghost{background:transparent;}
  .btn.danger-outline{border-color:var(--danger);color:var(--danger);background:transparent;}
  .btn:active{transform:scale(.98);}

  /* ---------- Quiz ---------- */
  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);}
  .quiz-q{font-size:16px;line-height:1.5;margin-bottom:18px;}
  .quiz-q .mono{color:var(--amber);}
  .qopt{
    display:block;width:100%;text-align:left;
    padding:13px 14px;margin-bottom:10px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-family:inherit;font-size:14px;cursor:pointer;line-height:1.4;
  }
  .qopt.correct{border-color:var(--accent);background:rgba(79,224,196,.12);}
  .qopt.wrong{border-color:var(--danger);background:rgba(242,123,107,.12);}
  .qopt:disabled{cursor:default;}
  .quiz-result{text-align:center;padding-top:30px;}
  .quiz-result .score{font-family:'JetBrains Mono',monospace;font-size:44px;color:var(--accent);font-weight:700;}

  /* ---------- Add content ---------- */
  .section-label{font-size:13px;color:var(--muted);margin:22px 0 10px;font-family:'JetBrains Mono',monospace;}
  .section-label:first-child{margin-top:0;}
  textarea, input[type=text]{
    width:100%;padding:12px 14px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-family:inherit;font-size:14px;resize:vertical;
  }
  textarea:focus, input[type=text]:focus, select:focus{outline:none;border-color:var(--accent);}
  select{
    width:100%;padding:12px 14px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-family:inherit;font-size:14px;
  }
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .preview-card{
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;
    background:var(--panel);
  }
  .preview-card .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .preview-card .ph label{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;color:var(--amber);font-weight:700;font-size:14px;}
  .preview-card input[type=text]{margin-bottom:6px;font-size:13px;padding:8px 10px;}
  .status-msg{font-size:13px;color:var(--muted);text-align:center;padding:16px 0;}
  .status-msg.err{color:var(--danger);}
  .toggle-manual{
    background:none;border:none;color:var(--accent);font-family:inherit;font-size:13px;
    cursor:pointer;padding:0;margin-bottom:16px;text-decoration:underline;
  }
  hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0;}

  /* ---------- Bottom nav ---------- */
  nav{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .navbtn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;
    cursor:pointer;padding:6px 0;
  }
  .navbtn.active{color:var(--accent);}
  .navbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}

  .loader{
    display:inline-block;width:16px;height:16px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:middle;margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div>
      <h1>UPLINK<span>Redes &amp; Ciberseguridad</span></h1>
    </div>
    <div class="signal" title="listo"></div>
  </div>
  <p id="moduleHint" style="font-size:11.5px;color:var(--muted);margin:0 0 8px;"></p>
  <div class="chips" id="moduleChips"></div>
</header>

<main id="main"></main>

<nav>
  <button class="navbtn active" data-tab="glosario">
    <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h11v18H6a2 2 0 0 1-2-2V5Z"/><path d="M17 3v18"/><path d="M8 8h5M8 12h5"/></svg>
    Glosario
  </button>
  <button class="navbtn" data-tab="cards">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 6V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>
    Tarjetas
  </button>
  <button class="navbtn" data-tab="quiz">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 1.7-2.4 3.4"/><path d="M12 17h.01"/></svg>
    Quiz
  </button>
  <button class="navbtn" data-tab="add">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    Añadir
  </button>
</nav>

<script>
/* ============ SEED DATA ============ */
const MODULES = [
  "Bloque 1 · Hardware e Infraestructura",
  "Bloque 2 · Protección y Destrucción de Datos",
  "Bloque 3 · Redes y Simuladores",
  "Bloque 4 · Certificaciones",
  "Bloque 5 · Normativas y Monitorización"
];

const SEED_DATA = [
  {"term":"TIER I","full":"Capacidad Básica (Uptime Institute)","definition":"Un solo camino de alimentación y refrigeración, sin componentes redundantes. Garantiza un 99.671% de uptime (disponibilidad anual), lo que permite hasta 28.8 horas de caída al año.","example":"Un pequeño servidor de oficina sin generador ni doble suministro eléctrico.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"TIER II","full":"Capacidad Redundante (Uptime Institute)","definition":"Añade componentes redundantes (por ejemplo un generador de más, N+1), pero mantiene un único camino de distribución. Garantiza un 99.741% de uptime, unas 22 horas de caída al año.","example":"Un centro de datos con dos generadores pero una sola línea eléctrica hasta los servidores.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"TIER III","full":"Mantenimiento Concurrente (Uptime Institute)","definition":"Añade una segunda ruta de distribución (una activa y otra alternativa), lo que permite hacer mantenimiento sin apagar nada. Garantiza un 99.982% de uptime, aprox. 1.6 horas de caída al año.","example":"Un datacenter que puede sustituir un generador sin interrumpir el servicio a sus clientes.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"TIER IV","full":"Tolerante a Fallos (Uptime Institute)","definition":"Sistemas completamente independientes y físicamente aislados (2N). Un fallo puntual no interrumpe el servicio ni siquiera mientras ocurre. Garantiza un 99.995% de uptime, unos 26 minutos de caída al año.","example":"El datacenter de un banco con dos instalaciones eléctricas totalmente independientes entre sí.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"TPM","full":"Trusted Platform Module","definition":"Chip de seguridad de la placa base necesario para cifrar el disco duro y guardar claves criptográficas de forma segura. Desde 2021 es requisito obligatorio para instalar Windows 11 (junto con Secure Boot). A finales de 2024 Microsoft empezó a permitir instalarlo sin TPM 2.0, pero el equipo se queda sin soporte oficial ni actualizaciones garantizadas.","example":"BitLocker necesita un TPM activo en la BIOS para poder cifrar el disco.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"BIOS / UEFI","full":"Basic Input/Output System / Unified Extensible Firmware Interface","definition":"Firmware básico que arranca el equipo antes del sistema operativo. Ahí se activan opciones de seguridad como el TPM.","example":"Entrar en la BIOS con Supr o F2 al encender el PC para activar el TPM.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"AMD SEV / Intel SGX","full":"Secure Encrypted Virtualization / Software Guard Extensions","definition":"Módulos de seguridad del procesador que aíslan procesos en memoria para que un virus no pueda leer datos de otros programas.","example":"Un servidor en la nube usa SGX para que ni el propio proveedor vea los datos que procesa una app.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"MBR / GPT","full":"Master Boot Record / GUID Partition Table","definition":"Son los dos esquemas para organizar las particiones de un disco. MBR es el más antiguo: soporta discos de hasta 2TB y máximo 4 particiones primarias, y se usa con arranque BIOS Legacy. GPT es el estándar actual: soporta discos mucho más grandes y más particiones, y requiere arranque en modo UEFI (normalmente con Secure Boot activado).","example":"Al instalar Windows en un disco nuevo de más de 2TB hay que formatearlo en GPT y arrancar el instalador en modo UEFI.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Secure Boot","full":"Arranque seguro","definition":"Modo de seguridad de la UEFI que solo permite arrancar sistemas operativos y cargadores de arranque firmados digitalmente, para bloquear rootkits o bootkits que intentan cargarse antes que el propio sistema operativo. Se activa o desactiva desde la BIOS/UEFI, y normalmente va ligado al uso de GPT.","example":"Hay que desactivar Secure Boot para instalar ciertas distribuciones antiguas de Linux o sistemas que no llevan firma digital.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"FAT32 / NTFS / ext4","full":"Sistemas de archivos","definition":"Es el formato en que el sistema operativo organiza los archivos dentro de una partición. FAT32 es antiguo pero muy compatible, aunque limita cada archivo a 4GB. NTFS es el estándar de Windows, sin ese límite y con permisos y cifrado. ext4 es el más usado en Linux.","example":"Un pendrive suele venir en FAT32 para que lo lean Windows, Mac y consolas; el disco interno de Windows va en NTFS.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Partición de recuperación y clave OEM","full":"","definition":"En los PCs con Windows original de fábrica, la clave de licencia no va en una pegatina: desde Windows 8 se graba en el propio firmware UEFI (tabla MSDM) y Windows la activa solo. Aparte suele existir una partición de recuperación con la imagen de fábrica del fabricante; si se borra al reinstalar, se pierde la opción de restaurar el equipo a su estado original.","example":"Antes de formatear un portátil de empresa, comprobar si tiene una partición 'Recovery' y no eliminarla si quieres conservar esa opción de restauración.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Hyper-Threading / SMT","full":"Simultaneous Multi-Threading","definition":"Tecnología que permite a un núcleo físico del procesador ejecutar dos hilos de instrucciones a la vez, simulando tener más núcleos de los que realmente tiene.","example":"Un procesador de 6 núcleos con Hyper-Threading aparece en el sistema como 12 'núcleos lógicos'.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Overclocking","full":"","definition":"Forzar a un componente (normalmente el procesador) a funcionar por encima de su velocidad de fábrica para ganar rendimiento, a costa de más calor, más consumo y riesgo de inestabilidad; suele anular la garantía.","example":"Subir la frecuencia de un procesador de 3.6GHz a 4.2GHz usando refrigeración líquida para evitar que se sobrecaliente.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Kill switch remoto","full":"Bloqueo/borrado remoto (ej. Intel vPro)","definition":"Función de seguridad de plataformas empresariales que permite a una empresa bloquear o borrar de forma remota un equipo robado o perdido, incluso antes de que llegue a arrancar el sistema operativo.","example":"Una empresa bloquea remotamente un portátil robado para que no arranque aunque le cambien el disco duro.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Memoria RAM","full":"Random Access Memory","definition":"Memoria volátil (se borra al apagar el equipo) donde se guardan temporalmente los datos y programas que se están usando en ese momento. Es mucho más rápida que el disco duro, pero no almacena nada de forma permanente.","example":"Al abrir muchos programas a la vez, la RAM se llena y el equipo va lento porque empieza a apoyarse en el disco.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"RAID","full":"Redundant Array of Independent Disks","definition":"Tecnología que combina varios discos duros físicos en una sola unidad lógica para tolerar fallos o mejorar el rendimiento (ej. RAID 1, RAID 5).","example":"Si un disco se rompe en un RAID 1 (espejo), el servidor sigue funcionando sin perder datos.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Procesador","full":"Unidad Central de Procesamiento (SoC completo)","definition":"Es el 'cerebro' del equipo: ejecuta instrucciones y coordina el resto de componentes. En los equipos modernos ya no es un único chip de cálculo, sino un SoC (System on a Chip) que integra varios chips especializados en el mismo dado de silicio: CPU, GPU, NPU, controlador de memoria, controladores de E/S, caché, y motores de seguridad y de vídeo.","example":"Un Intel Core Ultra o un Apple M-series llevan CPU, GPU y NPU en la misma pastilla de silicio, en vez de tener chips separados en la placa.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"CPU","full":"Central Processing Unit","definition":"Núcleos de propósito general que ejecutan la mayoría de instrucciones del sistema operativo y los programas. Los procesadores modernos combinan núcleos de rendimiento (P-cores) para tareas exigentes y núcleos de eficiencia (E-cores) para tareas ligeras.","example":"Un portátil con núcleos P y E puede reproducir música con los núcleos de eficiencia mientras editas vídeo con los de rendimiento, sin gastar batería de más.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"GPU integrada","full":"Graphics Processing Unit","definition":"Chip gráfico dentro del mismo procesador (a diferencia de una tarjeta gráfica dedicada aparte). Muestra la imagen en pantalla y acelera cálculo paralelo. A diferencia de una GPU dedicada con su propia memoria (VRAM), la GPU integrada usa la misma RAM del sistema, por lo que rinde menos en tareas exigentes.","example":"Un portátil de oficina sin tarjeta gráfica dedicada usa la GPU integrada del procesador para todo, compartiendo la RAM del sistema.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"NPU","full":"Neural Processing Unit","definition":"Chip especializado en ejecutar tareas de inteligencia artificial (redes neuronales) de forma mucho más eficiente que la CPU o la GPU, permitiendo correr modelos de IA en local sin depender de la nube. Se mide en TOPS (billones de operaciones por segundo).","example":"Los 'Copilot+ PC' necesitan una NPU capaz de al menos 40 TOPS para ejecutar funciones de IA local de Windows.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Controlador de memoria","full":"","definition":"Gestiona la comunicación entre el procesador y la RAM: cuántos módulos puede usar, a qué velocidad y en cuántos canales. Determina el límite máximo y la velocidad de la memoria que puede llevar un equipo.","example":"Un procesador con controlador de doble canal rinde más si le pones 2 módulos de RAM iguales en vez de uno solo del doble de capacidad.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Controladores de E/S","full":"Entrada/Salida (PCIe, USB, SATA)","definition":"Gestionan los puertos que conectan discos, tarjetas gráficas externas, USB y otros periféricos. Determinan cuántos puertos tiene el equipo y a qué velocidad máxima transfieren datos.","example":"Un procesador con más carriles PCIe permite conectar una tarjeta gráfica dedicada y varios discos SSD NVMe a la vez sin perder velocidad.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Caché (L1, L2, L3)","full":"Memoria caché del procesador","definition":"Memoria ultrarrápida dentro del propio chip para que el CPU no tenga que esperar tanto a la RAM. L1 es la más pequeña y rápida (una por núcleo), L2 es intermedia, y L3 es la más grande y suele compartirse entre todos los núcleos.","example":"Cuando un dato ya está en la caché L1, el procesador lo lee al instante; si tiene que ir a la RAM, tarda mucho más en comparación.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Motor de seguridad (Intel ME / AMD PSP)","full":"Platform Security Processor","definition":"Pequeño procesador dedicado dentro del chip, independiente de la CPU principal, encargado de cifrado, gestión de claves y arranque seguro; está relacionado con el TPM. Se ejecuta de forma oculta con acceso casi total al sistema incluso con el equipo apagado (en bajo consumo), lo que ha generado controversia de seguridad y privacidad.","example":"El TPM por software de muchos portátiles modernos en realidad se apoya en el AMD PSP o el Intel ME integrados en el procesador.","module":"Bloque 1 · Hardware e Infraestructura"},
  {"term":"Motor de vídeo (encoder/decoder)","full":"","definition":"Chip dedicado a comprimir y descomprimir vídeo. Gracias a él, un portátil puede reproducir o grabar vídeo en 4K sin que la CPU tenga que esforzarse, ahorrando mucha batería frente a hacerlo por software.","example":"Al ver una película en 4K en un portátil, la batería dura mucho más si el vídeo usa el motor de vídeo del procesador en vez de decodificarse por la CPU.","module":"Bloque 1 · Hardware e Infraestructura"},
  
  {"term":"Backup completo","full":"","definition":"Copia absolutamente todos los datos. Es el más lento y el que más espacio ocupa.","example":"Cada domingo se hace una copia completa de todo el servidor.","module":"Bloque 2 · Protección y Destrucción de Datos"},
  {"term":"Backup diferencial","full":"","definition":"Copia lo que ha cambiado desde la última copia completa.","example":"El martes se copia todo lo cambiado desde el domingo (backup completo).","module":"Bloque 2 · Protección y Destrucción de Datos"},
  {"term":"Backup incremental","full":"","definition":"Copia solo lo que ha cambiado desde el último backup, sea del tipo que sea. Es el más rápido, pero para restaurar hace falta toda la cadena.","example":"El miércoles solo se copia lo cambiado desde el backup del martes.","module":"Bloque 2 · Protección y Destrucción de Datos"},
  {"term":"BitLocker","full":"","definition":"Herramienta nativa de Windows que cifra el disco duro completo con contraseña, apoyándose en el TPM.","example":"Activar BitLocker en un portátil de empresa para que, si lo roban, no puedan leer el disco.","module":"Bloque 2 · Protección y Destrucción de Datos"},
  {"term":"Cobian Backup","full":"","definition":"Programa gratuito de copias de seguridad que permite cifrar los backups usando AES 256.","example":"Programar Cobian Backup para hacer cada noche una copia incremental cifrada.","module":"Bloque 2 · Protección y Destrucción de Datos"},
  {"term":"AES 256","full":"Advanced Encryption Standard (256 bits)","definition":"Estándar de cifrado militar/gubernamental, muy seguro, usado por herramientas como Cobian Backup. Nota: No confundir con el HASH: AES 256 cifra el contenido (hace falta la clave para leerlo); el HASH solo sirve para comprobar que el archivo no ha cambiado, no oculta nada.","example":"Un archivo cifrado con AES 256 tardaría siglos en romperse por fuerza bruta.","module":"Bloque 2 · Protección y Destrucción de Datos"},
  {"term":"Wiping (DoD)","full":"Formateo de bajo nivel","definition":"Sobrescribe todo el disco con ceros y unos varias veces siguiendo estándares (ej. DoD) para impedir recuperar los datos.","example":"Antes de vender un disco de empresa, se aplica wiping DoD en vez de un simple formateo.","module":"Bloque 2 · Protección y Destrucción de Datos"},
  {"term":"Degaussing","full":"Desmagnetización","definition":"Destruye la información de un disco con imanes ultrapotentes. Lo usan empresas especializadas en destrucción de datos.","example":"Una empresa de reciclaje de datos usa un degausser antes de desechar discos duros antiguos.","module":"Bloque 2 · Protección y Destrucción de Datos"},
  {"term":"HASH (SHA-256)","full":"Función resumen","definition":"Es la 'huella dactilar' digital de un archivo. Si el archivo cambia aunque sea un carácter, el hash cambia por completo. Garantiza la integridad. Para comprobarlo: descargas el archivo de la web oficial, calculas su hash con una herramienta y lo comparas carácter a carácter con el publicado en la página de descarga.","example":"Comparar el SHA-256 de un archivo descargado con el publicado en la web oficial para comprobar que no fue manipulado.","module":"Bloque 2 · Protección y Destrucción de Datos"},
  {"term":"Tipos de ataque según el objetivo","full":"","definition":"Cada tipo de ataque explota una parte distinta del equipo. Buffer overflow: satura la memoria asignada a un programa para sobrescribir la zona de al lado y ejecutar código propio. Rootkit/Bootkit: se instala en la BIOS/UEFI o en el arranque, casi indetectable. Escalada de privilegios: pasa de usuario normal a administrador. Malware/Ransomware: software que infecta el sistema operativo y cifra o roba datos. Phishing/Ingeniería social: ataca a la persona.","example":"El buffer overflow es justo la técnica de saturar la RAM asignada a un programa: al desbordar el búfer, el atacante escribe su código.","module":"Bloque 2 · Protección y Destrucción de Datos"},
  {"term":"Cold Boot Attack","full":"Ataque de arranque en frío","definition":"Técnica que enfría bruscamente los módulos de RAM de un PC encendido (con aire comprimido invertido o incluso nitrógeno líquido) para ralentizar la pérdida de la carga eléctrica cuando se apaga o se retira la memoria. Así se puede trasplantar la RAM a otro equipo y leer su contenido -incluidas claves de cifrado como las de BitLocker- antes de que se borre, sin que el sistema note un corte real de corriente. Se estudia tanto como técnica de ataque como de recuperación forense de datos.","example":"Un investigador forense enfría la RAM de un portátil bloqueado, la retira rápidamente y la conecta a otro equipo para extraer la clave de cifrado de BitLocker antes de que se pierda.","module":"Bloque 2 · Protección y Destrucción de Datos"},
  {"term":"Estándares de borrado seguro","full":"","definition":"No todos los métodos de sobrescritura son iguales. DoD 5220.22-M: estándar clásico de EE.UU., 3 pasadas con verificación. Gutmann: método antiguo de 35 pasadas, considerado excesivo hoy. NIST 800-88 (estándar actual): en discos SSD recomienda borrado criptográfico o el comando 'Secure Erase', porque sobrescribir muchas veces una SSD no es eficaz.","example":"Una empresa que recicla discos SSD usa el comando ATA Secure Erase en vez de aplicar 35 pasadas.","module":"Bloque 2 · Protección y Destrucción de Datos"},

  {"term":"Packet Tracer","full":"Cisco Packet Tracer","definition":"Simulador de redes de Cisco. Permite configurar routers y switches Cisco reales mediante comandos (CLI) o interfaz gráfica, simular protocolos como DHCP, DNS, VLANs y enrutamiento (RIP, OSPF), ver cómo viajan los paquetes en 'modo simulación', y añadir dispositivos IoT. Es la herramienta estándar para preparar el CCNA.","example":"Montar una red con routers y switches virtuales para practicar configuraciones sin comprar hardware real.","module":"Bloque 3 · Redes y Simuladores"},
  {"term":"NetAcad","full":"Cisco Networking Academy","definition":"Plataforma educativa global de Cisco, impartida a través de centros asociados (institutos, universidades, centros de formación). Ofrece cursos gratuitos o de bajo coste, desde introducción a la informática hasta ciberseguridad avanzada, con certificados de finalización reconocidos por el sector.","example":"Seguir el 'Curso 2' de NetAcad centrado en conceptos básicos de redes.","module":"Bloque 3 · Redes y Simuladores"},
  {"term":"Professional Skills","full":"Habilidades profesionales","definition":"Comunicación clara con perfiles no técnicos, trabajo en equipo, resolución de problemas (troubleshooting), adaptabilidad, atención al detalle, gestión del tiempo, ética y confidencialidad al manejar datos sensibles, documentación técnica, inglés técnico, y aprendizaje continuo.","example":"Explicar a un cliente sin conocimientos técnicos por qué se bloqueó su cuenta.","module":"Bloque 3 · Redes y Simuladores"},
  {"term":"Ruta de certificaciones recomendada","full":"Para empezar sin ir a la universidad","definition":"Orden orientativo para entrar en ciberseguridad: 1) ISC2 Certified in Cybersecurity (CC) — nivel de entrada. 2) CompTIA Network+ — fundamentos de redes. 3) CompTIA Security+ (SY0-701) — la más pedida en ofertas junior. 4) Cisco CCNA — para especializarse en redes.","example":"Alguien sin título universitario consigue su primer puesto de analista SOC junior tras sacarse la ISC2 CC y la Security+.","module":"Bloque 3 · Redes y Simuladores"},

  {"term":"Security+","full":"CompTIA Security+ (SY0-701)","definition":"Certificación teórica de entrada en ciberseguridad. Cubre redes, amenazas, criptografía y operaciones de seguridad.","example":"Muchas ofertas junior de ciberseguridad piden Security+ como requisito mínimo.","module":"Bloque 4 · Certificaciones"},
  {"term":"C|CSE","full":"Certified Cloud Security Engineer (EC-Council)","definition":"Certificación especializada en proteger entornos en la nube: AWS, Google Cloud, Azure.","example":"Un ingeniero que asegura los servidores en la nube de una empresa puede optar a la C|CSE.","module":"Bloque 4 · Certificaciones"},
  {"term":"OSCP","full":"Offensive Security Certified Professional (PEN-200)","definition":"Certificación práctica de hacking ético. El examen dura 24 horas y hay que hackear máquinas reales en un entorno controlado.","example":"Para conseguir el OSCP hay que demostrar en directo que sabes explotar vulnerabilidades reales.","module":"Bloque 4 · Certificaciones"},
  {"term":"Certificaciones accesibles con demanda laboral","full":"","definition":"Además de Security+ y OSCP, hay opciones como: ISC2 Certified in Cybersecurity (CC) (gratuita, ideal como primer paso); CompTIA Network+ (fundamentos de redes); Google Cybersecurity Certificate; CompTIA CySA+ (analista de seguridad, siguiente paso lógico tras Security+).","example":"Un perfil junior con Security+ y el certificado de Google puede optar a puestos de analista SOC nivel 1.","module":"Bloque 4 · Certificaciones"},

  {"term":"SGSI","full":"Sistema de Gestión de la Seguridad de la Información","definition":"Marco basado en el ciclo PDCA (Planificar, Hacer, Verificar, Actuar) para minimizar riesgos y asegurar la continuidad del negocio.","example":"Implementar la norma ISO 27001 en una empresa.","module":"Bloque 5 · Normativas y Monitorización"},
  {"term":"BIA","full":"Business Impact Analysis","definition":"Estudio que estima el coste y las consecuencias que tendría para el negocio la interrupción de sus procesos vitales.","example":"Calcular cuánto dinero pierde Amazon por cada minuto que su web está caída.","module":"Bloque 5 · Normativas y Monitorización"},
  {"term":"MAGERIT","full":"Metodología de Análisis y Gestión de Riesgos","definition":"Metodología oficial del gobierno de España para evaluar y certificar la seguridad de los sistemas de información.","example":"Usar MAGERIT v3 para homologar la red de un ayuntamiento.","module":"Bloque 5 · Normativas y Monitorización"}
];

let entries = [];
let currentTab = 'glosario';
let selectedModules = new Set();
let searchQuery = '';
let openTermId = null;

let fcOrder = [];
let fcIndex = 0;
let fcFlipped = false;

let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;
let quizFinished = false;

let aiPreview = null;
let customEntries = [];

/* ============ STORAGE ============ */
function loadEntries(){
  try{
    const raw = localStorage.getItem('uplink-custom-entries');
    customEntries = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(customEntries)) customEntries = [];
  }catch(e){
    customEntries = [];
  }
  entries = [
    ...SEED_DATA.map(e=>({...e, id: 'seed-'+cryptoId()})),
    ...customEntries
  ];
}
function persistCustom(){
  try{
    localStorage.setItem('uplink-custom-entries', JSON.stringify(customEntries));
  }catch(e){ console.error('storage error', e); }
}
function cryptoId(){
  return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2);
}
/* ============ RENDER: MAIN ROUTER ============ */
function render(){
  document.querySelectorAll('.navbtn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-tab')===currentTab);
  });
  const chipsWrap = document.getElementById('moduleChips');
  const hint = document.getElementById('moduleHint');
  if(currentTab==='add'){
    chipsWrap.style.display = 'none';
    hint.style.display = 'none';
  } else {
    chipsWrap.style.display = '';
    hint.style.display = '';
    renderChips();
  }
  const main = document.getElementById('main');
  if(currentTab==='glosario') main.innerHTML = renderGlosarioHtml();
  else if(currentTab==='cards') main.innerHTML = renderCardsHtml();
  else if(currentTab==='quiz') main.innerHTML = renderQuizHtml();
  else main.innerHTML = renderAddHtml();
  attachTabHandlers();
}

/* ============ GLOSARIO ============ */
function renderGlosarioHtml(){
  const list = filteredEntries().filter(e=>{
    if(!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return (e.term+' '+(e.full||'')+' '+e.definition).toLowerCase().includes(q);
  });
  if(list.length===0){
    return `<input class="search" id="searchInput" placeholder="Buscar término, sigla o concepto..." value="${escapeAttr(searchQuery)}">
      <div class="empty">No hay conceptos que coincidan.<br>Añade apuntes nuevos desde la pestaña "Añadir".</div>`;
  }
  const groups = {};
  list.forEach(e=>{ (groups[e.module] = groups[e.module]||[]).push(e); });

  let html = `<input class="search" id="searchInput" placeholder="Buscar término, sigla o concepto..." value="${escapeAttr(searchQuery)}">`;
  Object.keys(groups).forEach(mod=>{
    html += `<div class="module-group"><div class="module-title">${escapeHtml(mod)}</div>`;
    groups[mod].forEach(e=>{
      const open = openTermId===e.id;
      html += `
        <div class="term-row">
          <div class="term-head" data-toggle="${e.id}">
            <div>
              <div class="term-name">${escapeHtml(e.term)}</div>
              ${e.full ? `<div class="term-full">${escapeHtml(e.full)}</div>` : ''}
            </div>
          </div>
          <div class="term-body ${open?'open':''}">
            <div class="term-def">${escapeHtml(e.definition)}</div>
            ${e.example ? `<div class="term-ex">${escapeHtml(e.example)}</div>` : ''}
          </div>
        </div>`;
    });
    html += `</div>`;
  });
  return html;
}

/* ============ FLASHCARDS ============ */
function startFlashcards(){
  fcOrder = shuffle(filteredEntries());
  fcIndex = 0;
  fcFlipped = false;
}
function renderCardsHtml(){
  if(fcOrder.length===0 || !fcOrder.some(e=>filteredEntries().includes(e))) startFlashcards();
  if(fcOrder.length===0){
    return `<div class="empty">No hay tarjetas en este bloque todavía.</div>`;
  }
  const e = fcOrder[fcIndex];
  return `
    <div class="fc-wrap">
      <div class="fc-progress">${fcIndex+1} / ${fcOrder.length} · ${escapeHtml(e.module.split('·')[0].trim())}</div>
      <div class="fc-card ${fcFlipped?'flipped':''}" id="fcCard">
        <div class="fc-inner">
          <div class="fc-face front">
            <div class="fc-tag">Término</div>
            <div class="fc-term">${escapeHtml(e.term)}</div>
            ${e.full ? `<div class="fc-full">${escapeHtml(e.full)}</div>` : ''}
            <div class="fc-hint">Toca la tarjeta para ver la definición</div>
          </div>
          <div class="fc-face back">
            <div class="fc-tag">Definición</div>
            <div class="fc-def">${escapeHtml(e.definition)}</div>
            ${e.example ? `<div class="fc-ex">${escapeHtml(e.example)}</div>` : ''}
          </div>
        </div>
      </div>
      <div class="fc-controls">
        <button class="btn ghost" id="fcPrev">← Anterior</button>
        <button class="btn primary" id="fcNext">Siguiente →</button>
      </div>
    </div>`;
}

/* ============ QUIZ ============ */
function buildQuiz(){
  const pool = filteredEntries();
  const n = Math.min(pool.length, 10);
  const chosen = shuffle(pool).slice(0, n);
  quizQuestions = chosen.map(correct=>{
    const others = pool.filter(e=>e.id!==correct.id);
    const distractors = shuffle(others).slice(0,3).map(o=>o.definition);
    const askTermToDef = Math.random() > 0.4 || pool.length < 4;
    let prompt, correctOption, options;
    if(askTermToDef){
      prompt = `¿Cuál es la definición de <span class="mono">${escapeHtml(correct.term)}</span>?`;
      correctOption = correct.definition;
      options = shuffle([correctOption, ...distractors]);
    } else {
      prompt = `¿A qué término corresponde esta definición?<br><br>"${escapeHtml(correct.definition)}"`;
      correctOption = correct.term;
      const termDistractors = shuffle(others).slice(0,3).map(o=>o.term);
      correctOption = correct.term;
      options = shuffle([correct.term, ...termDistractors]);
    }
    return {prompt, options, correctOption};
  });
  quizIndex = 0; quizScore = 0; quizAnswered = false; quizFinished = false;
}
function renderQuizHtml(){
  if(quizQuestions.length===0 && filteredEntries().length < 2){
    return `<div class="empty">Necesitas al menos 2 conceptos en este bloque para hacer un quiz.</div>`;
  }
  if(quizQuestions.length===0) buildQuiz();
  if(quizFinished){
    return `
      <div class="quiz-result">
        <div class="fc-tag">Resultado</div>
        <div class="score">${quizScore}/${quizQuestions.length}</div>
        <p style="color:var(--muted);margin-top:6px;">${quizFeedback(quizScore, quizQuestions.length)}</p>
        <button class="btn primary" id="quizRestart" style="max-width:220px;margin:20px auto 0;">Repetir quiz</button>
      </div>`;
  }
  const q = quizQuestions[quizIndex];
  const optsHtml = q.options.map(opt=>{
    let cls = '';
    if(quizAnswered){
      if(opt===q.correctOption) cls = 'correct';
      else if(opt===q.selected) cls = 'wrong';
    }
    return `<button class="qopt ${cls}" data-opt="${escapeAttr(opt)}" ${quizAnswered?'disabled':''}>${escapeHtml(opt)}</button>`;
  }).join('');
  return `
    <div class="quiz-top"><span>Pregunta ${quizIndex+1}/${quizQuestions.length}</span><span>Aciertos: ${quizScore}</span></div>
    <div class="quiz-q">${q.prompt}</div>
    <div id="quizOpts">${optsHtml}</div>
    ${quizAnswered ? `<button class="btn primary" id="quizNext" style="margin-top:10px;">${quizIndex+1<quizQuestions.length?'Siguiente':'Ver resultado'}</button>` : ''}
  `;
}
function quizFeedback(score,total){
  const pct = score/total;
  if(pct===1) return "Perfecto. Dominas estos conceptos.";
  if(pct>=0.7) return "Muy bien. Repasa los que has fallado.";
  if(pct>=0.4) return "Vas por buen camino, repite el bloque.";
  return "Repasa el glosario y vuelve a intentarlo.";
}

    <button class="btn danger-outline" id="resetBtn" style="width:100%;margin-top:6px;">Borrar solo lo que he añadido yo</button>

function buildContextPrompt(){
  return `Eres un asistente que ayuda a un estudiante de un curso de redes y ciberseguridad (estilo Cisco NetAcad) a convertir sus apuntes de clase en tarjetas de estudio para una app.

Cuando te llegue este mensaje, NO generes nada todavía: pídeme primero que te pase el texto de mis apuntes, o que suba el PDF o documento de clase que quiero convertir en tarjetas.

Cuando te pase ese contenido, extrae TODOS los conceptos, términos técnicos y sobre todo TODAS las siglas o abreviaturas que encuentres. Genera una tarjeta por cada uno.

Bloques disponibles (usa el nombre exacto de uno si el concepto encaja bien; si no encaja en ninguno, usa "Bloque 6 · Otros conceptos"):
${MODULES.map(m=>'- '+m).join('\n')}

Cuando generes las tarjetas, responde ÚNICAMENTE con un array JSON válido, sin texto antes ni después, sin marcadores de código, con este formato exacto:
[{"term":"SIGLA o término","full":"significado completo de la sigla si aplica, si no aplica deja string vacío","definition":"explicación clara en español, 1-3 frases, en tus propias palabras","example":"un ejemplo práctico y concreto","module":"nombre exacto de uno de los bloques de arriba"}]

Espera a que te pase el contenido antes de generar nada.`;
}
function renderManualForm(){
  const wrap = document.getElementById('manualFormWrap');
  if(!showManualForm){ wrap.innerHTML=''; return; }
  const modOptions = MODULES.map(m=>`<option value="${escapeAttr(m)}">${escapeHtml(m)}</option>`).join('');
  wrap.innerHTML = `
    <div class="field"><label>Término / sigla</label><input type="text" id="mTerm" placeholder="ej. VPN"></div>
    <div class="field"><label>Significado de la sigla (si aplica)</label><input type="text" id="mFull" placeholder="ej. Virtual Private Network"></div>
    <div class="field"><label>Definición</label><textarea id="mDef" rows="3" placeholder="Explica el concepto con tus palabras"></textarea></div>
    <div class="field"><label>Ejemplo</label><textarea id="mEx" rows="2" placeholder="Un ejemplo práctico"></textarea></div>
    <div class="field"><label>Bloque</label><select id="mMod">${modOptions}</select></div>
    <button class="btn primary" id="mSave" style="width:100%;">Guardar tarjeta</button>
  `;
  document.getElementById('mSave').addEventListener('click', ()=>{
    const term = document.getElementById('mTerm').value.trim();
    const def = document.getElementById('mDef').value.trim();
    if(!term || !def){ alert('El término y la definición son obligatorios.'); return; }
    const newEntry = {
      id:cryptoId(), term,
      full: document.getElementById('mFull').value.trim(),
      definition: def,
      example: document.getElementById('mEx').value.trim(),
      module: document.getElementById('mMod').value
    };
    customEntries.push(newEntry);
    persistCustom();
    entries.push(newEntry);
    showManualForm = false;
    render();
  });
}

function importJsonResponse(){
  const statusEl = document.getElementById('aiStatus');
  const previewEl = document.getElementById('aiPreviewWrap');
  const rawJson = document.getElementById('jsonInput').value.trim();
  if(!rawJson){ statusEl.innerHTML = `<div class="status-msg err">Pega primero la respuesta JSON de la IA.</div>`; return; }
  try{
    const cleaned = rawJson.replace(/```json|```/g,'').trim();
    let parsed;
    try{ parsed = JSON.parse(cleaned); }
    catch(e){
      const match = cleaned.match(/\[[\s\S]*\]/);
      if(match) parsed = JSON.parse(match[0]);
      else throw e;
    }
    if(!Array.isArray(parsed) || parsed.length===0){
      statusEl.innerHTML = `<div class="status-msg err">Ese texto no parece un array JSON válido. Revisa que copiaste toda la respuesta de la IA.</div>`;
      return;
    }
    aiPreview = parsed.map(p=>({
      id: cryptoId(), include:true,
      term: p.term||'', full: p.full||'', definition: p.definition||'',
      example: p.example||'', module: MODULES.includes(p.module) ? p.module : "Bloque 6 · Otros conceptos"
    }));
    statusEl.innerHTML = `<div class="status-msg">Se importaron ${aiPreview.length} conceptos. Revisa y guarda los que quieras.</div>`;
    renderAiPreview();
  }catch(err){
    console.error(err);
    statusEl.innerHTML = `<div class="status-msg err">No se pudo leer ese JSON. Revisa que la IA no haya añadido texto antes o después del array.</div>`;
  }
}
function renderAiPreview(){
  const previewEl = document.getElementById('aiPreviewWrap');
  if(!aiPreview){ previewEl.innerHTML=''; return; }
  const modOptions = (m)=>MODULES.concat(["Bloque 6 · Otros conceptos"]).map(x=>`<option value="${escapeAttr(x)}" ${x===m?'selected':''}>${escapeHtml(x)}</option>`).join('');
  previewEl.innerHTML = aiPreview.map(p=>`
    <div class="preview-card" data-pid="${p.id}">
      <div class="ph">
        <label><input type="checkbox" ${p.include?'checked':''} data-check="${p.id}"> ${escapeHtml(p.term)}</label>
      </div>
      <input type="text" data-field="full" data-pid="${p.id}" value="${escapeAttr(p.full)}" placeholder="Significado de la sigla">
      <textarea data-field="definition" data-pid="${p.id}" rows="2" placeholder="Definición">${escapeHtml(p.definition)}</textarea>
      <textarea data-field="example" data-pid="${p.id}" rows="2" placeholder="Ejemplo" style="margin-top:6px;">${escapeHtml(p.example)}</textarea>
      <select data-field="module" data-pid="${p.id}" style="margin-top:6px;">${modOptions(p.module)}</select>
    </div>
  `).join('') + `<button class="btn primary" id="confirmSave" style="width:100%;margin-top:6px;">Guardar tarjetas seleccionadas</button>`;

  previewEl.querySelectorAll('[data-check]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const p = aiPreview.find(x=>x.id===cb.getAttribute('data-check'));
      p.include = cb.checked;
    });
  });
  previewEl.querySelectorAll('[data-field]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const p = aiPreview.find(x=>x.id===inp.getAttribute('data-pid'));
      p[inp.getAttribute('data-field')] = inp.value;
    });
  });
  document.getElementById('confirmSave').addEventListener('click', ()=>{
    const toAdd = aiPreview.filter(p=>p.include && p.term.trim() && p.definition.trim())
      .map(p=>({id:cryptoId(), term:p.term, full:p.full, definition:p.definition, example:p.example, module:p.module}));
    customEntries.push(...toAdd);
    persistCustom();
    entries.push(...toAdd);
    aiPreview = null;
    render();
  });
}

/* ============ EVENT WIRING ============ */
function attachTabHandlers(){
  if(currentTab==='glosario'){
    const search = document.getElementById('searchInput');
    if(search) search.addEventListener('input', e=>{ searchQuery = e.target.value; render(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').setSelectionRange(searchQuery.length, searchQuery.length); });
    document.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openTermId = openTermId===id ? null : id;
        render();
      });
    });
    // SE ELIMINÓ EL EVENT LISTENER DEL BOTÓN DE BORRAR TARJETAS
  }
  if(currentTab==='cards'){
    const card = document.getElementById('fcCard');
    if(card) card.addEventListener('click', ()=>{ fcFlipped = !fcFlipped; render(); });
    const prev = document.getElementById('fcPrev');
    const next = document.getElementById('fcNext');
    if(prev) prev.addEventListener('click', ()=>{ fcIndex = (fcIndex-1+fcOrder.length)%fcOrder.length; fcFlipped=false; render(); });
    if(next) next.addEventListener('click', ()=>{ fcIndex = (fcIndex+1)%fcOrder.length; fcFlipped=false; render(); });
  }
  if(currentTab==='quiz'){
    document.querySelectorAll('.qopt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const q = quizQuestions[quizIndex];
        q.selected = btn.getAttribute('data-opt');
        quizAnswered = true;
        if(q.selected===q.correctOption) quizScore++;
        render();
      });
    });
    const nextBtn = document.getElementById('quizNext');
    if(nextBtn) nextBtn.addEventListener('click', ()=>{
      if(quizIndex+1 < quizQuestions.length){ quizIndex++; quizAnswered=false; }
      else { quizFinished = true; }
      render();
    });
    const restart = document.getElementById('quizRestart');
    if(restart) restart.addEventListener('click', ()=>{ buildQuiz(); render(); });
  }
  if(currentTab==='add'){
    document.getElementById('toggleManual').addEventListener('click', ()=>{
      showManualForm = !showManualForm;
      render();
    });
    if(showManualForm) renderManualForm();
    document.getElementById('copyContextBtn').addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(buildContextPrompt());
        const b = document.getElementById('copyContextBtn');
        b.textContent = 'Copiado ✓';
        setTimeout(()=>{ const b2=document.getElementById('copyContextBtn'); if(b2) b2.textContent='Copiar prompt'; }, 1800);
      }catch(e){
        alert('No se pudo copiar automáticamente. Selecciona el texto de arriba y cópialo manualmente.');
      }
    });
    document.getElementById('importJsonBtn').addEventListener('click', importJsonResponse);
    if(aiPreview) renderAiPreview();
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      if(confirm('Esto eliminará solo las tarjetas que has añadido tú manualmente o por IA (las del código se quedan igual). ¿Continuar?')){
        customEntries = [];
        persistCustom();
        loadEntries();
        render();
      }
    });
  }
}

document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentTab = btn.getAttribute('data-tab');
    if(currentTab==='cards') startFlashcards();
    if(currentTab==='quiz'){ quizQuestions=[]; quizFinished=false; }
    openTermId = null;
    render();
  });
});

/* ============ UTIL ============ */
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ============ HELPERS ============ */
function allModulesUsed(){
  const set = new Set(entries.map(e=>e.module));
  return MODULES.filter(m=>set.has(m)).concat([...set].filter(m=>!MODULES.includes(m)));
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function filteredEntries(){
  if(selectedModules.size===0) return entries;
  return entries.filter(e=>selectedModules.has(e.module));
}

/* ============ RENDER: CHIPS ============ */
function renderChips(){
  const wrap = document.getElementById('moduleChips');
  const hint = document.getElementById('moduleHint');
  const mods = allModulesUsed();

  if(hint){
    if(currentTab==='glosario'){
      hint.textContent = 'Toca uno o varios bloques para filtrar (todos = todos marcados)';
    } else if(currentTab==='cards'){
      hint.textContent = 'Elige de qué bloques quieres tarjetas — puedes combinar varios, ej. Bloque 1 y Bloque 4';
    } else if(currentTab==='quiz'){
      hint.textContent = 'Elige de qué bloques salen las preguntas — puedes combinar varios, ej. Bloque 1 y Bloque 4';
    } else {
      hint.textContent = '';
    }
  }

  wrap.innerHTML = mods.map(m=>{
    const label = m.split('·')[0].trim();
    const active = (selectedModules.size===0 || selectedModules.has(m)) ? 'active' : '';
    return `<button class="chip ${active}" data-mod="${escapeAttr(m)}">${escapeHtml(label)}</button>`;
  }).join('');

  wrap.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const m = btn.getAttribute('data-mod');
      if(selectedModules.size===0){
        selectedModules = new Set(mods.filter(x=>x!==m));
      } else if(selectedModules.has(m)){
        selectedModules.delete(m);
        if(selectedModules.size===0){
          mods.forEach(x=>selectedModules.add(x));
          selectedModules.delete(m);
        }
      } else {
        selectedModules.add(m);
        if(selectedModules.size===mods.length) selectedModules = new Set();
      }
      if(currentTab==='cards') startFlashcards();
      if(currentTab==='quiz') { quizQuestions=[]; quizFinished=false; }
      render();
    });
  });
}

/* ============ INIT ============ */
(function init(){
  document.getElementById('main').innerHTML = `<div class="empty"><span class="loader"></span>Cargando tus tarjetas...</div>`;
  loadEntries();
  render();
})();
</script>
