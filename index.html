<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Uplink · Estudio de Redes y Ciberseguridad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1420;
    --panel:#161F30;
    --panel-2:#1D2A40;
    --line:#2A3A54;
    --text:#E8EDF6;
    --muted:#8CA0C0;
    --accent:#4FE0C4;
    --accent-dim:#2C5F58;
    --amber:#F2A65A;
    --danger:#F27B6B;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    padding:16px 16px 10px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#111827,var(--ink));
  }
  .brand{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;
  }
  .brand h1{
    font-size:19px;margin:0;letter-spacing:0.3px;font-weight:700;
  }
  .brand h1 span{color:var(--muted);font-weight:500;font-size:12px;display:block;margin-top:2px;}
  .signal{
    width:9px;height:9px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 0 rgba(79,224,196,.6);
    animation:pulse 2.4s infinite;
    flex:0 0 auto;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(79,224,196,.55);}
    70%{box-shadow:0 0 0 8px rgba(79,224,196,0);}
    100%{box-shadow:0 0 0 0 rgba(79,224,196,0);}
  }
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:6px 12px;
    border:1px solid var(--line);
    border-radius:20px;
    font-size:12.5px;
    color:var(--muted);
    background:var(--panel);
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s, color .15s;
  }
  .chip.active{
    border-color:var(--accent);
    color:var(--accent);
  }

  /* ---------- Main ---------- */
  main{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 16px 90px;
  }
  .empty{
    text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;
  }

  /* ---------- Glossary ---------- */
  .search{
    width:100%;padding:11px 14px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-family:inherit;font-size:14px;margin-bottom:14px;
  }
  .search:focus{outline:none;border-color:var(--accent);}
  .module-group{margin-bottom:6px;}
  .module-title{
    font-size:11.5px;color:var(--muted);margin:18px 0 8px;
    font-family:'JetBrains Mono',monospace;
    display:flex;align-items:center;gap:8px;
  }
  .module-title::after{content:"";flex:1;height:1px;background:var(--line);}
  .term-row{
    border-bottom:1px solid var(--line);
    padding:12px 2px;
  }
  .term-row:last-child{border-bottom:none;}
  .term-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    cursor:pointer;
  }
  .term-name{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--amber);font-size:15px;}
  .term-full{color:var(--muted);font-size:12px;margin-top:2px;}
  .term-body{
    max-height:0;overflow:hidden;transition:max-height .25s ease;
  }
  .term-body.open{max-height:2000px;margin-top:10px;}
  .term-def{font-size:14px;line-height:1.6;color:var(--text);margin-bottom:8px;white-space:pre-wrap;}
  .term-ex{
    font-size:13px;color:var(--muted);
    border-left:2px solid var(--accent-dim);
    padding-left:10px;line-height:1.6;white-space:pre-wrap;
  }

  /* ---------- Flashcards ---------- */
  .fc-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:8px;}
  .fc-progress{color:var(--muted);font-size:12.5px;font-family:'JetBrains Mono',monospace;}
  .fc-card{
    width:100%;max-width:420px;min-height:300px;
    perspective:1200px;
    cursor:pointer;
  }
  .fc-inner{
    position:relative;width:100%;height:100%;min-height:300px;
    transform-style:preserve-3d;
    transition:transform .5s;
  }
  .fc-card.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{
    position:absolute;inset:0;
    border-radius:14px;border:1px solid var(--line);
    background:var(--panel);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    backface-visibility:hidden;
  }
  .fc-face.back{
    transform:rotateY(180deg);
    background:var(--panel-2);
    align-items:flex-start;text-align:left;justify-content:flex-start;
    overflow-y:auto;
  }
  .fc-tag{
    font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;
    margin-bottom:14px;
  }
  .fc-term{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;color:var(--amber);}
  .fc-full{color:var(--muted);font-size:13px;margin-top:8px;}
  .fc-hint{color:var(--muted);font-size:11.5px;margin-top:18px;}
  .fc-def{font-size:14px;line-height:1.6;margin-bottom:10px;white-space:pre-wrap;}
  .fc-ex{font-size:13px;color:var(--muted);border-left:2px solid var(--accent-dim);padding-left:10px;line-height:1.6;white-space:pre-wrap;}
  .fc-controls{display:flex;gap:10px;width:100%;max-width:420px;}
  .btn{
    flex:1;padding:12px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-family:inherit;font-size:14px;
    cursor:pointer;font-weight:500;
  }
  .btn.primary{background:var(--accent);color:#08201B;border-color:var(--accent);font-weight:600;}
  .btn.ghost{background:transparent;}
  .btn.danger-outline{border-color:var(--danger);color:var(--danger);background:transparent;}
  .btn:active{transform:scale(.98);}

  /* ---------- Quiz ---------- */
  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);}
  .quiz-q{font-size:16px;line-height:1.5;margin-bottom:18px;white-space:pre-wrap;}
  .quiz-q .mono{color:var(--amber);}
  .qopt{
    display:block;width:100%;text-align:left;
    padding:13px 14px;margin-bottom:10px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-family:inherit;font-size:14px;cursor:pointer;line-height:1.4;
  }
  .qopt.correct{border-color:var(--accent);background:rgba(79,224,196,.12);}
  .qopt.wrong{border-color:var(--danger);background:rgba(242,123,107,.12);}
  .qopt:disabled{cursor:default;}
  .quiz-result{text-align:center;padding-top:30px;}
  .quiz-result .score{font-family:'JetBrains Mono',monospace;font-size:44px;color:var(--accent);font-weight:700;}

  /* ---------- Add content ---------- */
  .section-label{font-size:13px;color:var(--muted);margin:22px 0 10px;font-family:'JetBrains Mono',monospace;}
  .section-label:first-child{margin-top:0;}
  textarea, input[type=text]{
    width:100%;padding:12px 14px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-family:inherit;font-size:14px;resize:vertical;
  }
  textarea:focus, input[type=text]:focus, select:focus{outline:none;border-color:var(--accent);}
  select{
    width:100%;padding:12px 14px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-family:inherit;font-size:14px;
  }
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .preview-card{
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;
    background:var(--panel);
  }
  .preview-card .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .preview-card .ph label{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;color:var(--amber);font-weight:700;font-size:14px;}
  .preview-card input[type=text]{margin-bottom:6px;font-size:13px;padding:8px 10px;}
  .status-msg{font-size:13px;color:var(--muted);text-align:center;padding:16px 0;}
  .status-msg.err{color:var(--danger);}
  .toggle-manual{
    background:none;border:none;color:var(--accent);font-family:inherit;font-size:13px;
    cursor:pointer;padding:0;margin-bottom:16px;text-decoration:underline;
  }
  hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0;}

  /* ---------- Bottom nav ---------- */
  nav{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .navbtn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;
    cursor:pointer;padding:6px 0;
  }
  .navbtn.active{color:var(--accent);}
  .navbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}

  .loader{
    display:inline-block;width:16px;height:16px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:middle;margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div>
      <h1>UPLINK<span>Redes &amp; Ciberseguridad</span></h1>
    </div>
    <div class="signal" title="listo"></div>
  </div>
  <p id="moduleHint" style="font-size:11.5px;color:var(--muted);margin:0 0 8px;"></p>
  <div class="chips" id="moduleChips"></div>
</header>

<main id="main"></main>

<nav>
  <button class="navbtn active" data-tab="glosario">
    <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h11v18H6a2 2 0 0 1-2-2V5Z"/><path d="M17 3v18"/><path d="M8 8h5M8 12h5"/></svg>
    Glosario
  </button>
  <button class="navbtn" data-tab="cards">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 6V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>
    Tarjetas
  </button>
  <button class="navbtn" data-tab="quiz">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 1.7-2.4 3.4"/><path d="M12 17h.01"/></svg>
    Quiz
  </button>
  <button class="navbtn" data-tab="add">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    Añadir
  </button>
</nav>

<script>
/* ============ SEED DATA ============ */
const MODULES = [
  "Bloque 1 · Hardware y Sistemas",
  "Bloque 2 · Redes y Protocolos",
  "Bloque 3 · Seguridad e Identidad",
  "Bloque 4 · Auditoría y Herramientas",
  "Bloque 5 · Riesgos y Ataques",
  "Bloque 6 · Continuidad y Normativa",
  "Bloque 7 · Profesión"
];

const SEED_DATA = [
  {
    "term": "Procesador",
    "full": "",
    "definition": "¿Qué es?\nEl procesador es como el cerebro del ordenador. Es la pieza principal que recibe las instrucciones de los programas y hace los cálculos matemáticos y lógicos necesarios para que el equipo funcione.\n\n¿Para qué sirve?\nSirve para coordinar el resto de los componentes del ordenador y ejecutar las tareas que le pedimos.\n\nSe relaciona con:\nPrograma → CPU → cálculo → resultado",
    "example": "Ejemplo:\nSi abres la calculadora y escribes \"25 + 25\", el procesador recibe esos números, realiza la operación y envía la orden para que veas el resultado en la pantalla.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "CPU",
    "full": "Central Processing Unit",
    "definition": "¿Qué es?\nLa CPU es la parte principal del procesador. Es la encargada de ejecutar las instrucciones normales del sistema operativo y de los programas que utilizas cada día.\n\n¿Para qué sirve?\nRealiza los cálculos de propósito general que permiten abrir aplicaciones, escribir documentos o navegar por Internet.\n\nSe relaciona con:\nCPU → RAM → Almacenamiento",
    "example": "Ejemplo:\nCuando haces doble clic en el icono de un navegador web, la CPU se encarga de procesar todas las órdenes necesarias para que el programa se abra correctamente.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "Núcleos del procesador",
    "full": "",
    "definition": "¿Qué es?\nUn núcleo es como un pequeño procesador independiente dentro del procesador principal. Cada núcleo puede ejecutar una tarea distinta al mismo tiempo.\n\n¿Para qué sirve?\nPermite que el ordenador pueda hacer muchas cosas a la vez sin quedarse bloqueado (multitarea).\n\nSe relaciona con:\nProcesador → contiene varios núcleos",
    "example": "Ejemplo:\nNúcleo 1 → Carga una página web.\nNúcleo 2 → Reproduce música.\nNúcleo 3 → Analiza el sistema con el antivirus.\nNúcleo 4 → Mantiene un juego funcionando.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "Hyper-Threading / SMT",
    "full": "Simultaneous Multi-Threading",
    "definition": "¿Qué es?\nEs una tecnología que engaña al sistema operativo para que cada núcleo físico del procesador pueda hacer el trabajo de dos, dividiendo sus recursos (hilos lógicos).\n\n¿Para qué sirve?\nSirve para aprovechar al máximo el tiempo de cálculo del procesador, haciendo que el equipo rinda mejor cuando hay muchos programas abiertos.\n\nDiferencia clave:\nNúcleo = pieza física.\nHilo (Thread) = canal virtual de trabajo.",
    "example": "Ejemplo:\nSi compras un procesador de 6 núcleos con Hyper-Threading, el sistema operativo (como Windows) pensará que tienes 12 procesadores lógicos para repartir el trabajo.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "Memoria RAM",
    "full": "Random Access Memory",
    "definition": "¿Qué es?\nEs la memoria temporal y ultrarrápida del ordenador. Allí se guarda la información de los programas que estás utilizando en este momento exacto. Es volátil, lo que significa que se borra completamente al apagar el equipo.\n\n¿Para qué sirve?\nSirve para que el procesador pueda acceder casi al instante a los datos que necesita ahora mismo, sin tener que buscarlos en el disco duro, que es mucho más lento.\n\nSe relaciona con:\nDisco duro → guarda permanentemente\nRAM → guarda temporalmente",
    "example": "Ejemplo:\nAbres Chrome, Word y un juego. Toda esa información pasa del disco duro a la RAM. Si de repente se va la luz y el ordenador se apaga, todo lo que estaba en la RAM y no guardaste se pierde.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "Controlador de memoria",
    "full": "",
    "definition": "¿Qué es?\nEs el componente encargado de dirigir el tráfico de datos entre el procesador y la memoria RAM.\n\n¿Para qué sirve?\nSirve para organizar a qué velocidad y en qué canales viaja la información, evitando atascos de datos.\n\nSe relaciona con:\nCPU ↔ controlador de memoria ↔ RAM",
    "example": "Ejemplo:\nEl procesador pide un dato urgente a la RAM. El controlador de memoria localiza ese dato, lo extrae y se lo entrega rápidamente al procesador.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "Caché L1, L2 y L3",
    "full": "",
    "definition": "¿Qué es?\nSon unas memorias extremadamente pequeñas y rápidas que están construidas dentro del propio procesador. \nL1 es la más pequeña y rápida. L2 es intermedia. L3 es la más grande y normalmente se comparte entre todos los núcleos.\n\n¿Para qué sirve?\nEvita que el procesador tenga que ir hasta la RAM a buscar los datos que usa constantemente, ahorrando mucho tiempo.",
    "example": "Ejemplo:\nPiensa en buscar un bolígrafo:\nL1 = Lo tienes en la mano.\nL2 = Lo tienes sobre tu mesa.\nL3 = Lo tienes en un cajón de tu habitación.\nRAM = Tienes que ir a buscarlo a otra habitación.\nCuanto más cerca está el dato (L1), más rápido trabaja el ordenador.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "GPU integrada",
    "full": "Graphics Processing Unit",
    "definition": "¿Qué es?\nEs un chip encargado de procesar gráficos (imágenes y vídeos) que viene directamente incrustado dentro del mismo chip del procesador, en lugar de ser una tarjeta separada.\n\n¿Para qué sirve?\nSirve para mostrar la pantalla, ver vídeos y ejecutar juegos básicos sin necesidad de comprar una tarjeta gráfica cara dedicada.\n\nDiferencia clave:\nGPU integrada → comparte memoria con la RAM del sistema.\nTarjeta gráfica dedicada → tiene su propia memoria ultrarrápida.",
    "example": "Ejemplo:\nEn un portátil de instituto, la GPU integrada permite que puedas usar Windows y ver vídeos de YouTube perfectamente, ahorrando batería y espacio.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "NPU",
    "full": "Neural Processing Unit",
    "definition": "¿Qué es?\nEs un chip especializado diseñado únicamente para realizar cálculos relacionados con inteligencia artificial y redes neuronales.\n\n¿Para qué sirve?\nSirve para ejecutar herramientas de IA directamente en tu ordenador (como traducir voz a texto o desenfocar fondos en videollamadas) de forma rapidísima y gastando muy poca batería.\n\nSe relaciona con:\nCPU → tareas generales\nGPU → gráficos\nNPU → inteligencia artificial",
    "example": "Ejemplo:\nSi usas una herramienta de IA para eliminar el ruido de fondo de tu micrófono durante una llamada, la NPU hace ese trabajo para que la CPU no se ralentice.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "Controladores de E/S",
    "full": "Entrada/Salida (Input/Output)",
    "definition": "¿Qué es?\nSon los componentes que gestionan las conexiones entre el procesador y todos los aparatos externos o periféricos (como discos duros, pendrives, teclado o ratón).\n\n¿Para qué sirve?\nSirven para traducir y dirigir la información que entra (Entrada) desde el ratón o teclado, y la que sale (Salida) hacia un pendrive o una pantalla.\n\nSe relaciona con:\nCPU → controlador E/S → puerto USB → teclado",
    "example": "Ejemplo:\nConectas un pendrive al ordenador. El controlador de E/S detecta que lo has enchufado y prepara el camino de datos para que puedas copiar archivos rápidamente.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "Motor de vídeo",
    "full": "",
    "definition": "¿Qué es?\nEs una sección específica del procesador dedicada en exclusiva a comprimir y descomprimir vídeo (codificador/decodificador).\n\n¿Para qué sirve?\nPermite reproducir películas de muy alta calidad (como 4K) de manera fluida y sin que la batería del portátil se agote rápido.\n\nSe relaciona con:\nFormatos de vídeo (H.264, H.265) → Motor de vídeo → Pantalla",
    "example": "Ejemplo:\nCuando ves una película en Netflix a máxima calidad, el motor de vídeo se encarga de traducirla a imágenes. Si tuviera que hacerlo la CPU normal, el ordenador se calentaría mucho más.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "Overclocking",
    "full": "",
    "definition": "¿Qué es?\nEs una técnica manual donde el usuario obliga a un componente (normalmente el procesador o la tarjeta gráfica) a trabajar a una velocidad mayor que la que el fabricante estableció de fábrica.\n\n¿Para qué sirve?\nSirve para conseguir más rendimiento y velocidad gratis en juegos o programas pesados.\n\nConsecuencia:\nProduce mucho más calor y consumo eléctrico. Si no se enfría bien, puede romper el equipo o hacer que se cuelgue.",
    "example": "Ejemplo:\nTienes un procesador diseñado para ir a 3,6 GHz. Entras en la configuración y lo fuerzas para que funcione a 4,2 GHz. Irá más rápido, pero necesitarás un ventilador mucho más potente.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "TPM",
    "full": "Trusted Platform Module",
    "definition": "¿Qué es?\nEs un pequeño chip de seguridad soldado en la placa base (o integrado en el procesador) que funciona como una caja fuerte para el ordenador.\n\n¿Para qué sirve?\nSirve para guardar claves criptográficas de forma segura, comprobar que el hardware no ha sido alterado y es un requisito obligatorio para usar sistemas como Windows 11 o cifrar el disco duro.\n\nSe relaciona con:\nTPM → clave de cifrado → BitLocker",
    "example": "Ejemplo:\nCifras el disco duro de tu portátil con BitLocker. La llave para poder leer ese disco se guarda en el chip TPM. Si un ladrón roba solo el disco duro y lo conecta a otro ordenador, no podrá leer nada porque le falta tu chip TPM.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "BIOS / UEFI",
    "full": "Basic Input/Output System / Unified Extensible Firmware Interface",

    "full": "",
    "definition": "¿Qué es?\nSon normativas oficiales que indican exactamente cuántas veces y con qué patrones hay que sobrescribir un disco para que la información se considere legal y técnicamente destruida.\n\n¿Para qué sirve?\nGarantiza que una empresa cumple con la ley al desechar equipos.\n\nEjemplos del temario:\n- DoD 5220.22-M: Estándar militar clásico de EE.UU. (3 pasadas).\n- Gutmann: Método antiguo y paranoico (35 pasadas).\n- NIST 800-88: Estándar moderno, recomienda métodos criptográficos o comandos internos (Secure Erase) para los discos SSD actuales.",
    "example": "Ejemplo:\nEl departamento técnico aplica el estándar NIST 800-88 a los discos SSD antes de reciclarlos, porque saben que hacer 35 pasadas (Gutmann) a un SSD moderno solo acortaría su vida útil sin mejorar el borrado.",
    "module": "Bloque 1 · Hardware y Sistemas"
  },
  {
    "term": "Sistema Binario",
    "full": "Base 2",
    "definition": "¿Qué es?\nEs un sistema numérico que utiliza únicamente dos símbolos: el 0 y el 1 (apagado y encendido). Es el lenguaje de más bajo nivel que entienden los ordenadores.\n\n¿Para qué sirve?\nSirve para representar toda la información, cálculos y datos que un ordenador procesa y transmite.\n\nSe relaciona con:\nBinario (0,1) → Decimal (0-9) → Hexadecimal (0-9, A-F)",
    "example": "Ejemplo:\nLa letra \"A\" en el ordenador no se guarda como una letra física, sino que se traduce a un código binario como 01000001.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Sistema Decimal",
    "full": "Base 10",
    "definition": "¿Qué es?\nEs el sistema numérico que utilizamos los humanos en nuestro día a día. Utiliza diez símbolos: del 0 al 9.\n\n¿Para qué sirve?\nEn redes, se usa para mostrar de forma amigable direcciones que internamente son binarias.\n\nEjemplo:\nLas direcciones IP que configuramos (como 192.168.1.1) se escriben en sistema decimal para que podamos leerlas fácilmente, aunque el router las procesa en binario.",
    "example": "Ejemplo:\nEs mucho más fácil recordar la IP 192.168.1.1 (decimal) que su equivalente binario 11000000.10101000.00000001.00000001.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Sistema Hexadecimal",
    "full": "Base 16",
    "definition": "¿Qué es?\nEs un sistema numérico que utiliza 16 símbolos: los números del 0 al 9, y las letras de la A a la F (donde A=10, B=11, C=12, D=13, E=14, F=15).\n\n¿Para qué sirve?\nSirve para agrupar y compactar grandes cadenas de ceros y unos binarios, haciéndolas más cortas y fáciles de leer para los informáticos.\n\nProcedimiento:\nCada letra/número hexadecimal equivale exactamente a 4 bits (ceros o unos).\n1010₂ = A₁₆",
    "example": "Ejemplo:\nLas direcciones MAC de las tarjetas de red se escriben siempre en hexadecimal (ej: 00:1A:2B:3C:4D:5E) porque si se escribieran en binario serían larguísimas (48 bits).",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Sistema Octal",
    "full": "Base 8",
    "definition": "¿Qué es?\nEs un sistema numérico que utiliza ocho símbolos: del 0 al 7.\n\n¿Para qué sirve?\nEn informática se suele utilizar para representar de forma compacta permisos de archivos, especialmente en sistemas operativos Linux o Unix.",
    "example": "Ejemplo:\nEn Linux, el comando \"chmod 777\" utiliza el sistema octal para dar permisos totales (lectura, escritura y ejecución) a un archivo.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Ponderación posicional",
    "full": "",
    "definition": "¿Qué es?\nEs el método matemático que da un valor distinto a cada número dependiendo de la posición que ocupe, elevando la base a una potencia.\n\n¿Para qué sirve?\nSirve para convertir números de binario a decimal (o a otras bases) sumando el valor que le corresponde a cada \"1\" según su posición.\n\nProcedimiento (de binario a decimal):\n1010\n(1 × 2³) + (0 × 2²) + (1 × 2¹) + (0 × 2⁰)\n8 + 0 + 2 + 0 = 10",
    "example": "Ejemplo:\nEn el número decimal 350, el 3 vale trescientos, no tres, gracias a su posición. En binario ocurre exactamente lo mismo, pero usando potencias del número 2 (1, 2, 4, 8, 16...).",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Modelo OSI",
    "full": "Open Systems Interconnection",
    "definition": "¿Qué es?\nEs un modelo teórico de 7 capas que explica cómo viaja la información desde el programa de un ordenador hasta el cable de red, y viceversa.\n\n¿Para qué sirve?\nSirve como mapa estándar para que los fabricantes de software y hardware puedan crear productos que se entiendan entre sí, y para ayudar a diagnosticar problemas de red.\n\nLas 7 capas:\n7. Aplicación\n6. Presentación\n5. Sesión\n4. Transporte\n3. Red\n2. Enlace de datos\n1. Física",
    "example": "Ejemplo:\nSi una página web no carga, el modelo OSI te ayuda a buscar el problema por capas: ¿Está roto el cable (Capa 1)? ¿El router está mal configurado (Capa 3)? ¿Falla el navegador web (Capa 7)?",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Modelo TCP/IP",
    "full": "",
    "definition": "¿Qué es?\nEs un modelo práctico y simplificado (normalmente de 4 o 5 capas) que describe exactamente cómo funciona Internet en el mundo real, agrupando algunas capas del modelo OSI.\n\n¿Para qué sirve?\nDefine las reglas básicas de cómo los ordenadores deben empaquetar, enrutar y recibir los datos a través de redes globales.\n\nCapas principales:\nAplicación → Transporte → Internet (Red) → Acceso a la red.",
    "example": "Ejemplo:\nMientras el Modelo OSI es como los planos teóricos de un coche, el Modelo TCP/IP es el motor real que hace funcionar las comunicaciones de Internet en tu ordenador cada día.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Dirección IP",
    "full": "Internet Protocol Address",
    "definition": "¿Qué es?\nEs un identificador numérico lógico asignado a cualquier dispositivo que se conecte a una red. Es como el número de teléfono o la matrícula del ordenador.\n\n¿Para qué sirve?\nSirve para que la red sepa a dónde tiene que enviar los paquetes de datos y de dónde provienen.\n\nSe relaciona con:\nMAC → Dirección física fija.\nIP → Dirección lógica que puede cambiar si cambias de red.",
    "example": "Ejemplo:\nCuando tu ordenador se conecta al Wi-Fi de tu casa, el router le da la dirección IP 192.168.1.33. Si vas a una cafetería, ese router te dará una IP diferente para navegar.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Máscara de subred",
    "full": "",
    "definition": "¿Qué es?\nEs un número que acompaña siempre a una dirección IP y actúa como una \"plantilla\" separadora.\n\n¿Para qué sirve?\nSirve para indicarle al ordenador qué parte de su dirección IP corresponde a la red general (el barrio) y qué parte identifica al dispositivo concreto (la casa).\n\nProcedimiento:\nSi tenemos la IP 192.168.1.25 y la máscara 255.255.255.0:\n192.168.1 → Parte de RED.\n.25 → Parte del DISPOSITIVO.",
    "example": "Ejemplo:\nGracias a la máscara de subred, tu ordenador sabe que si quiere hablar con el equipo 192.168.1.50 está en su misma red local, pero si quiere ir a 8.8.8.8 tiene que salir a Internet.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Gateway",
    "full": "Puerta de enlace predeterminada",
    "definition": "¿Qué es?\nEs la dirección IP del dispositivo (normalmente el router) que sirve como puerta de salida hacia otras redes o hacia Internet.\n\n¿Para qué sirve?\nCuando tu ordenador quiere enviar un paquete a una dirección IP que no está en su red local, se lo envía automáticamente al Gateway para que él se encargue de enrutarlo hacia su destino.\n\nSe relaciona con:\nPC → Gateway (Router) → Internet",
    "example": "Ejemplo:\nSi tu PC es 192.168.1.10 y quieres abrir Google, tu PC envía la petición a 192.168.1.1 (tu router o Gateway), y el router se encarga de buscar a Google en Internet.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Dirección MAC",
    "full": "Media Access Control",
    "definition": "¿Qué es?\nEs el identificador físico único grabado de fábrica en la tarjeta de red de cada dispositivo (compuesto por 48 bits, escritos en hexadecimal).\n\n¿Para qué sirve?\nSirve para identificar el dispositivo físicamente dentro de una red local. Los switches utilizan la MAC para enviar los datos exactamente al cable correcto.\n\nSe relaciona con:\nIP → Para comunicarse entre diferentes redes (Internet).\nMAC → Para comunicarse dentro de la misma red local (Switch).",
    "example": "Ejemplo:\n00:1A:2B:3C:4D:5E es una dirección MAC. Nunca cambia, aunque te lleves el portátil de tu casa a la universidad.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "OUI",
    "full": "Organizationally Unique Identifier",
    "definition": "¿Qué es?\nSon los primeros 24 bits (los tres primeros pares de números/letras) de una dirección MAC.\n\n¿Para qué sirve?\nSirve para identificar qué empresa o fabricante ha construido esa tarjeta de red.\n\nEjemplo:\nEn la MAC 00:1A:2B:3C:4D:5E:\n00:1A:2B → OUI (identifica al fabricante, ej. Cisco, Intel o Apple).\n3C:4D:5E → Número de serie único de la tarjeta.",
    "example": "Ejemplo:\nSi capturas tráfico de red en Wireshark y ves que la MAC empieza por un OUI específico de Apple, sabes que ese dispositivo es un iPhone, iPad o Mac.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "TCP",
    "full": "Transmission Control Protocol",
    "definition": "¿Qué es?\nEs el protocolo de transporte más utilizado en Internet. Está orientado a conexión, lo que significa que establece un canal seguro antes de enviar datos.\n\n¿Para qué sirve?\nSirve para garantizar que los datos se entreguen de forma fiable, ordenando los paquetes que llegan desordenados y pidiendo que se reenvíen los que se pierden por el camino.\n\nSe relaciona con:\nTCP → lentitud inicial pero 100% de fiabilidad.",
    "example": "Ejemplo:\nCuando descargas un archivo PDF o visitas una web bancaria, se usa TCP. Si se perdiera un solo paquete de datos, el archivo quedaría corrupto, así que TCP asegura que llegue entero.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Banderas TCP (TCP Flags)",
    "full": "Indicadores de control TCP",
    "definition": "¿Qué es?\nSon unas \"etiquetas\" invisibles dentro de un paquete TCP que indican el propósito de ese paquete o el estado de la conexión.\n\n¿Para qué sirven?\nSirven para que los ordenadores se comuniquen y gestionen la conexión:\n- SYN: Inicia o sincroniza una conexión.\n- ACK: Confirma que ha recibido un paquete.\n- FIN: Pide cerrar la conexión de forma amable.\n- RST: Corta o rechaza la conexión de golpe.\n- PSH: Pide entregar los datos rápidos a la aplicación.\n- URG: Marca datos como urgentes.",
    "example": "Ejemplo:\nSi tu ordenador manda un paquete con la bandera SYN, le está diciendo al servidor: \"Hola, quiero abrir una conexión nueva contigo\".",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Three-Way Handshake",
    "full": "Saludo de tres vías TCP",
    "definition": "¿Qué es?\nEs el proceso obligatorio de tres pasos que utiliza TCP para establecer una conexión antes de enviar el primer dato útil.\n\n¿Para qué sirve?\nSirve para que tanto el cliente como el servidor se pongan de acuerdo, sincronicen sus números y confirmen que ambos están listos para hablar.\n\nProcedimiento:\n1. Cliente → SYN (Quiero conectarme)\n2. Servidor → SYN + ACK (Vale, acepto. Yo también me conecto)\n3. Cliente → ACK (Perfecto, recibido)\n\nResultado:\nLa conexión queda establecida y empieza la transferencia de datos.",
    "example": "Ejemplo:\nEs como llamar por teléfono:\n1. Tú: \"¿Diga?\" (SYN)\n2. Él: \"Hola, soy Juan, te escucho\" (SYN+ACK)\n3. Tú: \"Vale Juan, te cuento...\" (ACK y empiezan los datos).",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "UDP",
    "full": "User Datagram Protocol",
    "definition": "¿Qué es?\nEs un protocolo de transporte muy sencillo y sin conexión. Envía los paquetes de datos directamente sin avisar ni hacer ningún \"saludo\" previo.\n\n¿Para qué sirve?\nSirve para enviar datos a la máxima velocidad posible. No comprueba si los paquetes llegan, ni en qué orden lo hacen, por lo que no pierde tiempo en verificaciones.\n\nSe relaciona con:\nUDP → velocidad máxima, pero sin garantías.",
    "example": "Ejemplo:\nSe utiliza en videojuegos online, videollamadas o streaming en directo. Si pierdes un paquete en una videollamada, la imagen se pixela un segundo, pero la llamada sigue sin detenerse a recuperar esa imagen.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "TCP vs UDP",
    "full": "Diferencias principales",
    "definition": "¿Qué es?\nEs la comparación entre los dos protocolos de transporte principales de Internet.\n\nDiferencias claras:\nTCP:\n- Orientado a conexión (Three-Way Handshake).\n- Confirma la entrega (ACK).\n- Ordena los paquetes.\n- Más seguro y fiable, pero más lento.\n\nUDP:\n- No orientado a conexión.\n- No confirma nada, dispara los datos.\n- Menor sobrecarga de red.\n- Más rápido, ideal cuando importa más la inmediatez que la perfección.",
    "example": "Ejemplo:\nTCP es como enviar una carta certificada con acuse de recibo. UDP es como gritar un mensaje desde la ventana a alguien que va en bicicleta.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "DHCP",
    "full": "Dynamic Host Configuration Protocol",
    "definition": "¿Qué es?\nEs el protocolo que permite configurar automáticamente los dispositivos de una red.\n\n¿Para qué sirve?\nEvita que tengamos que escribir a mano la dirección IP, la máscara de subred, la puerta de enlace (Gateway) y el DNS en cada ordenador o móvil nuevo que se conecta a la red.\n\nSe relaciona con:\nDHCP → IP dinámica temporal (concesión).",
    "example": "Ejemplo:\nCuando un amigo viene a casa y pone la contraseña de tu Wi-Fi, su móvil habla por debajo con tu router usando DHCP y recibe al instante una IP válida para poder navegar.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "DHCP DORA",
    "full": "Discover, Offer, Request, ACK",
    "definition": "¿Qué es?\nEs la secuencia de cuatro mensajes que intercambian un dispositivo y un servidor DHCP para configurar la red.\n\n¿Para qué sirve?\nGarantiza que el dispositivo obtenga una IP válida y que el servidor registre que esa IP ya está ocupada.\n\nProcedimiento:\n1. DISCOVER: Cliente grita \"¿Hay algún servidor DHCP libre?\"\n2. OFFER: Servidor responde \"Sí, te ofrezco la IP 192.168.1.50\"\n3. REQUEST: Cliente contesta \"Me parece bien, solicito quedarme esa IP\"\n4. ACK: Servidor confirma \"De acuerdo, IP asignada, aquí tienes el resto de datos\".",
    "example": "Ejemplo:\nEs una subasta rápida e invisible que ocurre en un par de milisegundos cada vez que enciendes el PC o activas el Wi-Fi del móvil.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "DHCP Release y NAK",
    "full": "",
    "definition": "¿Qué es?\nSon dos mensajes complementarios del protocolo DHCP.\n\n¿Para qué sirven?\n- RELEASE: Lo envía el cliente para decirle al servidor: \"Ya no necesito esta IP, la libero para que se la des a otro\".\n- NAK (Negative Acknowledgement): Lo envía el servidor para decirle al cliente: \"No acepto tu solicitud\" (por ejemplo, si el cliente pide una IP que ya se le dio a otro equipo).\n\nSe relaciona con:\nRenovación de IP → ciclo de vida de DHCP.",
    "example": "Ejemplo:\nApagas el ordenador correctamente en la oficina. Antes de apagarse, manda un mensaje de Release al servidor DHCP para que la IP 192.168.1.10 quede libre para el turno de tarde.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "DNS",
    "full": "Domain Name System",
    "definition": "¿Qué es?\nEs el sistema de resolución de nombres de Internet, a menudo descrito como la \"agenda telefónica\" de la red.\n\n¿Para qué sirve?\nSirve para traducir los nombres de dominio legibles por humanos (como google.com) a las direcciones IP numéricas que los ordenadores necesitan para conectarse.\n\nProcedimiento:\nEscribes marca.com → Tu PC consulta al servidor DNS → El DNS responde \"Esa web está en la IP 104.18.23.10\" → Tu PC se conecta a esa IP.",
    "example": "Ejemplo:\nSin DNS, tendrías que memorizar números como 142.250.200.14 para entrar en YouTube.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Registros y Puerto DNS",
    "full": "",
    "definition": "¿Qué es?\nLos registros DNS son las diferentes entradas o reglas dentro del servidor (ej. registro A para IPv4, registro MX para el correo). El servicio DNS trabaja habitualmente escuchando en el puerto 53.\n\n¿Para qué sirve?\nPermiten al servidor organizar qué IP corresponde a la web, qué servidor maneja los emails de esa empresa, etc.\n\nSe relaciona con:\nPuerto UDP 53 → consultas rápidas normales de DNS.\nPuerto TCP 53 → transferencias de zona grandes entre servidores.",
    "example": "Ejemplo:\nCuando mandas un email a info@empresa.com, tu servidor pide el \"Registro MX\" de empresa.com al DNS por el puerto 53 para saber a qué máquina exacta debe enviar el correo.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Puertos de Red",
    "full": "",
    "definition": "¿Qué es?\nUn puerto es un número (del 0 al 65535) asociado a una dirección IP. Funciona como una \"puerta virtual\" dentro del ordenador.\n\n¿Para qué sirve?\nSirve para que el ordenador sepa a qué programa o servicio debe entregar los datos que le llegan. \n\nClasificación (IANA):\n0 a 1023 → Puertos bien conocidos (sistemas y servicios fijos).\n1024 a 49151 → Puertos registrados (aplicaciones comerciales).\n49152 a 65535 → Puertos dinámicos/privados (usados por el cliente para la vuelta de datos).",
    "example": "Ejemplo:\nTu IP recibe dos paquetes: uno para el puerto 80 y otro para el 25. El sistema sabe que el paquete del 80 va al servidor Web y el del 25 al servidor de correos.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Puerto 21 (FTP)",
    "full": "File Transfer Protocol",
    "definition": "¿Qué es?\nEs el puerto predeterminado para el protocolo de transferencia de archivos (FTP).\n\n¿Para qué sirve?\nSe utilizaba masivamente para subir y descargar archivos hacia o desde un servidor. Hoy en día se considera inseguro porque envía las contraseñas en texto plano (sin cifrar).",
    "example": "Ejemplo:\nUn diseñador sube las imágenes de una nueva página web al servidor de la empresa usando el puerto 21.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Puerto 22 (SSH)",
    "full": "Secure Shell",
    "definition": "¿Qué es?\nEs el puerto del protocolo SSH.\n\n¿Para qué sirve?\nSirve para conectarse de forma remota a la consola de comandos de un servidor o dispositivo de forma totalmente cifrada y segura.\n\nSe relaciona con:\nSSH → Administración remota de Linux o routers.",
    "example": "Ejemplo:\nUn informático en Madrid abre una terminal, usa SSH y se conecta de forma segura al puerto 22 de un servidor en Alemania para instalar unas actualizaciones.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Puerto 23 (Telnet)",
    "full": "",
    "definition": "¿Qué es?\nEs el protocolo antiguo de administración remota.\n\n¿Para qué sirve?\nServía para conectarse por comandos a otra máquina, pero transmite absolutamente todo (incluidas las contraseñas de administrador) en texto plano, por lo que cualquiera en la red puede leerlas.\n\nDiferencia:\nTelnet (23) → Inseguro.\nSSH (22) → Seguro y cifrado.",
    "example": "Ejemplo:\nEn ciberseguridad, encontrar el puerto 23 abierto en un equipo moderno se considera una vulnerabilidad crítica de mala configuración.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Puerto 25 (SMTP)",
    "full": "Simple Mail Transfer Protocol",
    "definition": "¿Qué es?\nEs el puerto estándar original para el envío de correo electrónico.\n\n¿Para qué sirve?\nSirve para que tu ordenador envíe un email al servidor de correos, o para que dos servidores de correo se envíen mensajes entre sí.",
    "example": "Ejemplo:\nCuando le das a \"Enviar\" en tu programa de correo, este contacta con el puerto 25 de tu servidor de salida para entregarle el mensaje.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Puerto 80 (HTTP)",
    "full": "Hypertext Transfer Protocol",
    "definition": "¿Qué es?\nEs el puerto predeterminado para el tráfico web sin cifrar.\n\n¿Para qué sirve?\nPermite cargar páginas web básicas. La información viaja en texto claro, por lo que alguien en tu misma red Wi-Fi podría ver qué estás leyendo o interceptar lo que escribes.",
    "example": "Ejemplo:\nSi entras en una página que no tiene el \"candadito\" en el navegador (http://), te estás comunicando por el puerto 80.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Puerto 443 (HTTPS)",
    "full": "Hypertext Transfer Protocol Secure",
    "definition": "¿Qué es?\nEs el puerto estándar para la navegación web segura y cifrada.\n\n¿Para qué sirve?\nUtiliza certificados TLS/SSL para cifrar toda la información que viaja entre tu navegador y la página web, garantizando confidencialidad e integridad.\n\nSe relaciona con:\nPuerto 80 (HTTP) → inseguro.\nPuerto 443 (HTTPS) → cifrado.",
    "example": "Ejemplo:\nCuando compras en Amazon o entras al banco, aparece el candadito en el navegador porque estás usando HTTPS a través del puerto 443, protegiendo los datos de tu tarjeta de crédito.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Puerto 445 (SMB)",
    "full": "Server Message Block",
    "definition": "¿Qué es?\nEs el protocolo nativo de Windows para compartir recursos en la red local.\n\n¿Para qué sirve?\nSirve para compartir carpetas, archivos y acceder a impresoras de red entre ordenadores Windows.\n\nAdvertencia de seguridad:\nExponer el puerto 445 directamente a Internet es un riesgo gigante, porque muchos ataques (como el ransomware WannaCry) explotan vulnerabilidades de SMB.",
    "example": "Ejemplo:\nEn una oficina, abres la \"Carpeta Compartida\" que está en el servidor para coger un documento Excel. Esa conexión interna usa el puerto 445.",
    "module": "Bloque 2 · Redes y Protocolos"
  },
  {
    "term": "Puerto 3389 (RDP)",
    "full": "Remote Desktop Protocol",
    "definition": "¿Qué es?\nEs el protocolo oficial de Escritorio Remoto de Microsoft Windows.\n\n¿Para qué sirve?\nPermite ver la pantalla completa y controlar el teclado y ratón de otro ordenador Windows a distancia, como si estuvieras sentado delante de él.\n\nSe relaciona con:\nSSH (22) → Consola de comandos remota.\nRDP (3389) → Pantalla gráfica remota.",
    "example": "Ejemplo:\nUn oficinista trabaja desde casa conectándose mediante RDP (puerto 3389) al ordenador de su mesa en la empresa, viendo su fondo de pantalla y sus programas exactos.",

function renderGlosarioHtml(){
  const list = filteredEntries().filter(e=>{
    if(!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return (e.term+' '+(e.full||'')+' '+e.definition).toLowerCase().includes(q);
  });
  if(list.length===0){
    return `<input class="search" id="searchInput" placeholder="Buscar término, sigla o concepto..." value="${escapeAttr(searchQuery)}">
      <div class="empty">No hay conceptos que coincidan.<br>Añade apuntes nuevos desde la pestaña "Añadir".</div>`;
  }
  const groups = {};
  list.forEach(e=>{ (groups[e.module] = groups[e.module]||[]).push(e); });

  let html = `<input class="search" id="searchInput" placeholder="Buscar término, sigla o concepto..." value="${escapeAttr(searchQuery)}">`;
  Object.keys(groups).forEach(mod=>{
    html += `<div class="module-group"><div class="module-title">${escapeHtml(mod)}</div>`;

      const open = openTermId===e.id;
      html += `
        <div class="term-row">

            <div>
              <div class="term-name">${escapeHtml(e.term)}</div>
              ${e.full ? `<div class="term-full">${escapeHtml(e.full)}</div>` : ''}

            ${e.example ? `<div class="term-ex">${escapeHtml(e.example)}</div>` : ''}

        </div>`;
    });
    html += `</div>`;
  });
  return html;

/* ============ QUIZ ============ */
function buildQuiz(){
  const pool = filteredEntries();
  const fixedPool = QUESTION_BANK.filter(q => selectedModules.size === 0 || selectedModules.has(q.module));

  // 1. Generar preguntas automáticas desde las tarjetas
  const autoQuestions = pool.map(correct => {
    const others = pool.filter(e => e.id !== correct.id);
    const distractors = shuffle(others).slice(0, 3).map(o => o.definition);
    const askTermToDef = Math.random() > 0.4 || pool.length < 4;
    let prompt, correctOption, options;
    
    if(askTermToDef){
      prompt = `¿Cuál es la definición de <span class="mono">${escapeHtml(correct.term)}</span>?`;
      correctOption = correct.definition;
      options = shuffle([correctOption, ...distractors]);
    } else {
      prompt = `¿A qué término corresponde esta definición?\n\n"${escapeHtml(correct.definition)}"`;
      correctOption = correct.term;
      const termDistractors = shuffle(others).slice(0, 3).map(o => o.term);
      options = shuffle([correct.term, ...termDistractors]);
    }
    return { prompt, options, correctOption };
  });

  // 2. Generar preguntas desde el banco fijo
  const fixedQuestions = fixedPool.map(fq => {
    const otherFixed = fixedPool.filter(o => o.q !== fq.q);
    const distractors = shuffle(otherFixed).slice(0, 3).map(o => o.a);
    
    while(distractors.length < 3) {
      const fallback = shuffle(pool)[0];
      if (fallback) distractors.push(fallback.definition);
      else distractors.push("Opción incorrecta autogenerada");
    }
    
    return {
      prompt: fq.q,
      correctOption: fq.a,
      options: shuffle([fq.a, ...distractors.slice(0, 3)])
    };
  });

  // 3. Combinar y seleccionar aleatoriamente 10 preguntas
  const combined = shuffle([...autoQuestions, ...fixedQuestions]);
  const n = Math.min(combined.length, 10);
  quizQuestions = combined.slice(0, n);

  quizIndex = 0; quizScore = 0; quizAnswered = false; quizFinished = false;
}

function renderQuizHtml(){
  if(quizQuestions.length===0 && filteredEntries().length < 2 && QUESTION_BANK.length === 0){
    return `<div class="empty">Necesitas al menos 2 conceptos en este bloque para hacer un quiz.</div>`;
  }
  if(quizQuestions.length===0) buildQuiz();
  if(quizFinished){
    return `
      <div class="quiz-result">
        <div class="fc-tag">Resultado</div>
        <div class="score">${quizScore}/${quizQuestions.length}</div>
        <p style="color:var(--muted);margin-top:6px;">${quizFeedback(quizScore, quizQuestions.length)}</p>
        <button class="btn primary" id="quizRestart" style="max-width:220px;margin:20px auto 0;">Repetir quiz</button>
      </div>`;
  }
  const q = quizQuestions[quizIndex];
  const optsHtml = q.options.map(opt=>{
    let cls = '';
    if(quizAnswered){
      if(opt===q.correctOption) cls = 'correct';
      else if(opt===q.selected) cls = 'wrong';
    }
    return `<button class="qopt ${cls}" data-opt="${escapeAttr(opt)}" ${quizAnswered?'disabled':''}>${escapeHtml(opt)}</button>`;
  }).join('');
  return `
    <div class="quiz-top"><span>Pregunta ${quizIndex+1}/${quizQuestions.length}</span><span>Aciertos: ${quizScore}</span></div>
    <div class="quiz-q">${q.prompt}</div>
    <div id="quizOpts">${optsHtml}</div>
    ${quizAnswered ? `<button class="btn primary" id="quizNext" style="margin-top:10px;">${quizIndex+1<quizQuestions.length?'Siguiente':'Ver resultado'}</button>` : ''}
  `;
}
function quizFeedback(score,total){
  const pct = score/total;
  if(pct===1) return "Perfecto. Dominas estos conceptos.";
  if(pct>=0.7) return "Muy bien. Repasa los que has fallado.";
  if(pct>=0.4) return "Vas por buen camino, repite el bloque.";
  return "Repasa el glosario y vuelve a intentarlo.";
}

function importJsonResponse(){
  const statusEl = document.getElementById('aiStatus');
  const rawJson = document.getElementById('jsonInput').value.trim();
  
  if(!rawJson){ statusEl.innerHTML = `<div class="status-msg err">Pega primero la respuesta JSON de la IA.</div>`; return; }
  
  try{
    // Limpieza de marcadores de cita si los hubiera y limpieza de markdown
    let cleaned = rawJson.replace(/```json|```/g,'').trim();
    cleaned = cleaned.replace(/\s*\]*\]\s*/gi, " ");
    
    let parsed;
    try{ parsed = JSON.parse(cleaned); }
    catch(e){
      const match = cleaned.match(/\[[\s\S]*\]/);
      if(match) parsed = JSON.parse(match[0]);
      else throw e;
    }
    
    if(!Array.isArray(parsed) || parsed.length===0){
      statusEl.innerHTML = `<div class="status-msg err">Ese texto no parece un array JSON válido. Revisa que copiaste toda la respuesta de la IA.</div>`;
      return;
    }
    
    aiPreview = parsed.map(p=>({
      id: cryptoId(), include:true,
      term: p.term||'', full: p.full||'', definition: p.definition||'',
      example: p.example||'', module: MODULES.includes(p.module) ? p.module : MODULES[0]
    }));
    
    statusEl.innerHTML = `<div class="status-msg">Se importaron ${aiPreview.length} conceptos. Revisa y guarda los que quieras.</div>`;
    renderAiPreview();
  }catch(err){
    console.error(err);
    statusEl.innerHTML = `<div class="status-msg err">No se pudo leer ese JSON. Revisa que la IA no haya añadido texto extra fuera del array.</div>`;
  }
}
function renderAiPreview(){
  const previewEl = document.getElementById('aiPreviewWrap');
  if(!aiPreview){ previewEl.innerHTML=''; return; }
  const modOptions = (m)=>MODULES.map(x=>`<option value="${escapeAttr(x)}" ${x===m?'selected':''}>${escapeHtml(x)}</option>`).join('');
  previewEl.innerHTML = aiPreview.map(p=>`
    <div class="preview-card" data-pid="${p.id}">
      <div class="ph">
        <label><input type="checkbox" ${p.include?'checked':''} data-check="${p.id}"> ${escapeHtml(p.term)}</label>
      </div>
      <input type="text" data-field="full" data-pid="${p.id}" value="${escapeAttr(p.full)}" placeholder="Significado de la sigla">
      <textarea data-field="definition" data-pid="${p.id}" rows="2" placeholder="Definición">${escapeHtml(p.definition)}</textarea>
      <textarea data-field="example" data-pid="${p.id}" rows="2" placeholder="Ejemplo" style="margin-top:6px;">${escapeHtml(p.example)}</textarea>
      <select data-field="module" data-pid="${p.id}" style="margin-top:6px;">${modOptions(p.module)}</select>
    </div>
  `).join('') + `<button class="btn primary" id="confirmSave" style="width:100%;margin-top:6px;">Guardar tarjetas seleccionadas</button>`;

  previewEl.querySelectorAll('[data-check]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const p = aiPreview.find(x=>x.id===cb.getAttribute('data-check'));
      p.include = cb.checked;
    });
  });
  previewEl.querySelectorAll('[data-field]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const p = aiPreview.find(x=>x.id===inp.getAttribute('data-pid'));
      p[inp.getAttribute('data-field')] = inp.value;
    });
  });
  document.getElementById('confirmSave').addEventListener('click', ()=>{
    const toAdd = aiPreview.filter(p=>p.include && p.term.trim() && p.definition.trim())
      .map(p=>({id:cryptoId(), term:p.term, full:p.full, definition:p.definition, example:p.example, module:p.module}));
    customEntries.push(...toAdd);
    persistCustom();
    entries.push(...toAdd);
    aiPreview = null;
    render();
  });
}

  if(currentTab==='glosario'){
    const search = document.getElementById('searchInput');
    if(search) search.addEventListener('input', e=>{ searchQuery = e.target.value; render(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').setSelectionRange(searchQuery.length, searchQuery.length); });
    document.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openTermId = openTermId===id ? null : id;
        render();
      });
    });
  }
  if(currentTab==='cards'){
    const card = document.getElementById('fcCard');
    if(card) card.addEventListener('click', ()=>{ fcFlipped = !fcFlipped; render(); });
    const prev = document.getElementById('fcPrev');
    const next = document.getElementById('fcNext');
    if(prev) prev.addEventListener('click', ()=>{ fcIndex = (fcIndex-1+fcOrder.length)%fcOrder.length; fcFlipped=false; render(); });
    if(next) next.addEventListener('click', ()=>{ fcIndex = (fcIndex+1)%fcOrder.length; fcFlipped=false; render(); });
  }
  if(currentTab==='quiz'){
    document.querySelectorAll('.qopt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const q = quizQuestions[quizIndex];
        q.selected = btn.getAttribute('data-opt');
        quizAnswered = true;
        if(q.selected===q.correctOption) quizScore++;
        render();
      });
    });
    const nextBtn = document.getElementById('quizNext');
    if(nextBtn) nextBtn.addEventListener('click', ()=>{
      if(quizIndex+1 < quizQuestions.length){ quizIndex++; quizAnswered=false; }
      else { quizFinished = true; }
      render();
    });
    const restart = document.getElementById('quizRestart');
    if(restart) restart.addEventListener('click', ()=>{ buildQuiz(); render(); });
  }
  if(currentTab==='add'){
    document.getElementById('toggleManual').addEventListener('click', ()=>{
      showManualForm = !showManualForm;
      render();
    });
    if(showManualForm) renderManualForm();
    document.getElementById('copyContextBtn').addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(buildContextPrompt());
        const b = document.getElementById('copyContextBtn');
        b.textContent = 'Copiado ✓';
        setTimeout(()=>{ const b2=document.getElementById('copyContextBtn'); if(b2) b2.textContent='Copiar prompt'; }, 1800);
      }catch(e){
        alert('No se pudo copiar automáticamente. Selecciona el texto de arriba y cópialo manualmente.');
      }
    });
    document.getElementById('importJsonBtn').addEventListener('click', importJsonResponse);
    if(aiPreview) renderAiPreview();
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      if(confirm('Esto eliminará solo las tarjetas que has añadido tú manualmente o por IA (las del código se quedan igual). ¿Continuar?')){
        customEntries = [];
        persistCustom();
        loadEntries();
        render();
      }
    });
  }
}

document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentTab = btn.getAttribute('data-tab');
    if(currentTab==='cards') startFlashcards();
    if(currentTab==='quiz'){ quizQuestions=[]; quizFinished=false; }
    openTermId = null;
    render();
  });
});

/* ============ UTIL ============ */
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ============ HELPERS ============ */
function allModulesUsed(){
  const set = new Set(entries.map(e=>e.module));
  return MODULES.filter(m=>set.has(m)).concat([...set].filter(m=>!MODULES.includes(m)));
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function filteredEntries(){
  if(selectedModules.size===0) return entries;
  return entries.filter(e=>selectedModules.has(e.module));
}

/* ============ RENDER: CHIPS ============ */
function renderChips(){
  const wrap = document.getElementById('moduleChips');
  const hint = document.getElementById('moduleHint');
  const mods = allModulesUsed();

  if(hint){
    if(currentTab==='glosario'){
      hint.textContent = 'Toca uno o varios bloques para filtrar (todos = todos marcados)';
    } else if(currentTab==='cards'){
      hint.textContent = 'Elige de qué bloques quieres tarjetas — puedes combinar varios';
    } else if(currentTab==='quiz'){
      hint.textContent = 'Elige de qué bloques salen las preguntas — puedes combinar varios';
    } else {
      hint.textContent = '';
    }
  }

  wrap.innerHTML = mods.map(m=>{
    const label = m.split('·')[0].trim();
    const active = (selectedModules.size===0 || selectedModules.has(m)) ? 'active' : '';
    return `<button class="chip ${active}" data-mod="${escapeAttr(m)}">${escapeHtml(label)}</button>`;
  }).join('');

  wrap.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const m = btn.getAttribute('data-mod');
      if(selectedModules.size===0){
        selectedModules = new Set(mods.filter(x=>x!==m));
      } else if(selectedModules.has(m)){
        selectedModules.delete(m);
        if(selectedModules.size===0){
          mods.forEach(x=>selectedModules.add(x));
          selectedModules.delete(m);
        }
      } else {
        selectedModules.add(m);
        if(selectedModules.size===mods.length) selectedModules = new Set();
      }
      if(currentTab==='cards') startFlashcards();
      if(currentTab==='quiz') { quizQuestions=[]; quizFinished=false; }
      render();
    });
  });
}

/* ============ INIT ============ */
(function init(){
  document.getElementById('main').innerHTML = `<div class="empty"><span class="loader"></span>Cargando tus tarjetas...</div>`;
  loadEntries();
  render();
})();
</script>
